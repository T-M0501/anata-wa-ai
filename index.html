<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>あなたはAIです</title>
<style>
/* ================= 共通（タイトルなど：落ち着いた中立のデザイン） ================= */
:root{
  --font-std:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,sans-serif;
  --font-round:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Rounded Mplus 1c","Yu Gothic","Meiryo",sans-serif;
  --mono:"SFMono-Regular","Menlo","Consolas","Hiragino Sans",monospace;
}
#app{
  --bg:#F7F4EE; --surface:#FFFFFF; --ink:#2E2A26; --ink2:#6F685F; --line:#E3DDD3;
  --accent:#2F6B6F; --accentInk:#FFFFFF; --accentSoft:#E4EEEC;
  --ok:#4F8463; --okSoft:#E5EFE7; --ng:#A95F5A; --ngSoft:#F5E7E4; --warn:#A8843A; --warnSoft:#F4ECDA;
  --r:12px; --rs:8px; --shadow:0 1px 2px rgba(40,30,20,.05),0 6px 16px rgba(40,30,20,.05);
  --c1:#FFFFFF; --c2:#FFFFFF; --c3:#FFFFFF; --c4:#FFFFFF; --c5:#FFFFFF;
  --font:var(--font-std);
}
#app.kids{
  --bg:#FFF9F1; --surface:#FFFFFF; --ink:#4E423A; --ink2:#857669; --line:#EFE3D3;
  --accent:#3E9478; --accentInk:#FFFFFF; --accentSoft:#DFF2EA;
  --ok:#3E9478; --okSoft:#E2F3EB; --ng:#D27F6C; --ngSoft:#FCEBE5; --warn:#C99A2E; --warnSoft:#FFF3D3;
  --r:16px; --rs:12px; --shadow:0 2px 0 rgba(78,66,58,.07),0 4px 12px rgba(78,66,58,.05);
  --c1:#DFF2EA; --c2:#E2EEFA; --c3:#FDE7DC; --c4:#FFF2CF; --c5:#ECE6F8;
  --font:var(--font-round);
}
#app.adult{
  --bg:#F5F3EE; --surface:#FFFFFF; --ink:#262626; --ink2:#666660; --line:#DAD6CE;
  --accent:#1F4E5F; --accentInk:#FFFFFF; --accentSoft:#E4EBEE;
  --ok:#4C7757; --okSoft:#E6EEE7; --ng:#9E5858; --ngSoft:#F3E6E5; --warn:#9A7A35; --warnSoft:#F2EBDA;
  --r:8px; --rs:6px; --shadow:0 1px 2px rgba(0,0,0,.06);
  --font:var(--font-std);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9E5DE;font-size:16px;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overflow:clip;box-shadow:0 0 30px rgba(0,0,0,.06)}
@media (min-width:700px){#app.wide{max-width:1100px}}
button{font-family:inherit;color:inherit;font-size:16px;touch-action:manipulation;cursor:pointer;border:none;background:none;-webkit-user-select:none;user-select:none}
ruby rt{font-size:.5em;color:var(--ink2)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 14px)}
.scr.on{display:flex;animation:fadeIn .25s ease}
.narrow{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:var(--r);font-weight:700;font-size:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:translateY(1px);filter:brightness(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.soft{background:var(--accentSoft);border-color:transparent}
.btn.big{min-height:54px;font-size:18px}
.row{display:flex;gap:10px} .row>*{flex:1}
.icon-btn{width:44px;height:44px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--line);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.muted{color:var(--ink2);font-size:14px}
h2{margin:4px 0 10px;font-size:20px;text-align:center}
.pic{display:inline-flex;align-items:center;justify-content:center}
.pic img,.pic svg{width:100%;height:100%;object-fit:contain;display:block}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none;min-height:44px}
.hdr .ttl{flex:1;text-align:center;font-weight:700;font-size:16px;line-height:1.3}
.badge{display:inline-block;background:var(--accentSoft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}

/* ---- タイトル ---- */
.t-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.t-head{display:flex;align-items:center;gap:14px}
.t-head .pic{width:64px;height:64px;flex:none}
.t-title{font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1.15}
.t-title em{font-style:normal;color:var(--accent)}
.t-sub{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.5}
.t-q{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.08em;margin:4px 0 -6px}
.aud-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aud{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:118px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;box-shadow:var(--shadow)}
.aud:active{border-color:var(--accent)}
.aud b{font-size:20px}
.aud small{font-size:13px;color:var(--ink2);line-height:1.5}
.aud .mark{width:28px;height:4px;border-radius:2px}
.aud.k .mark{background:#7CC4A6} .aud.a .mark{background:#1F4E5F}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:6px 14px;width:100%;text-align:left}
.tog+.tog{border-top:1px solid var(--line)}
.tog b{font-size:15px;font-weight:700} .tog small{display:block;font-size:12.5px;color:var(--ink2)}
.sw{width:46px;height:28px;border-radius:999px;background:#D9D3C9;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tog.on .sw{background:var(--accent)} .tog.on .sw::after{left:21px}
.two-help{background:var(--accentSoft);border-radius:var(--r);padding:10px 14px;font-size:14px;line-height:1.6}
.two-help ol{margin:4px 0 0;padding-left:1.3em}
.linkrow{display:flex;gap:10px}
.linkrow .btn{flex:1;font-weight:600;font-size:15px}

/* ---- 選択画面 ---- */
.lead{font-size:18px;font-weight:800;margin:4px 0 12px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.choice:active{border-color:var(--accent)}
.choice .no{width:40px;height:40px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;background:var(--accentSoft);font-size:18px}
.choice b{font-size:17px;display:block}
.choice small{display:block;font-size:13px;color:var(--ink2);line-height:1.45;margin-top:2px}
.choice .rt{margin-left:auto;font-size:13px;color:var(--ink2);flex:none;text-align:right}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;margin-bottom:10px;flex:none}
.seg button{flex:1;min-height:42px;border-radius:calc(var(--r) - 3px);font-weight:700;font-size:14px;line-height:1.25;padding:2px 4px}
.seg button.sel{background:var(--accent);color:var(--accentInk)}
.theme-card{margin-bottom:12px}
.tc-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tc-head .no{width:38px;height:38px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--accentSoft);flex:none}
.tc-head b{font-size:16px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{min-height:64px;border-radius:var(--rs);background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;gap:2px;font-size:15px}
.lv small{font-size:12px;color:var(--ink2);font-weight:400}
.lv .st{font-size:13px;color:var(--warn);letter-spacing:1px}
.lv.locked{opacity:.5}
.kids .choice .no{background:var(--c1)} .kids .choice:nth-child(3n+2) .no{background:var(--c3)} .kids .choice:nth-child(3n) .no{background:var(--c2)}

/* ---- ゲーム画面（問題と指示書を同時に表示） ---- */
.gtop{display:flex;align-items:center;gap:8px;flex:none;min-height:44px;margin-bottom:8px}
.gtop .ttl{flex:1;min-width:0}
.gtop .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;gap:5px;margin-top:4px}
.prog i{flex:1;max-width:36px;height:5px;border-radius:3px;background:var(--line);display:block}
.prog i.ok{background:var(--ok)} .prog i.ng{background:var(--ng)} .prog i.wait{background:var(--warn)} .prog i.cur{background:var(--accent)}
.hearts{display:flex;gap:1px;flex:none}
.hearts svg{width:22px;height:22px}
.lives{font-size:13px;color:var(--ink2);flex:none;text-align:right;line-height:1.3}
.lives b{color:var(--ink);font-family:var(--mono)}
.gbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"q" "s" "m" "a";gap:8px}
.qpane{grid-area:q;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:calc((100dvh - 300px) * .5);min-height:110px}
.split-q .qpane{max-height:calc((100dvh - 300px) * .8)}
.split-m .qpane{max-height:calc((100dvh - 300px) * .25)}
.splitbar{grid-area:s;display:flex;gap:6px}
.splitbar button{flex:1;min-height:34px;white-space:nowrap;font-size:12px!important;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink2)}
.splitbar button.sel{background:var(--accentSoft);color:var(--ink);border-color:var(--accentSoft)}
.mpane{grid-area:m;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:var(--r);min-height:0}
.abar{grid-area:a}
.gbody.two{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"q" "a"}
.gbody.two .qpane{max-height:none}
@media (min-width:700px){
  #app.wide .gbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"q m" "a m";gap:14px}
  #app.wide .qpane{max-height:none}
  #app.wide .splitbar{display:none}
  #app.wide .gbody.two{grid-template-columns:minmax(0,640px);justify-content:center;grid-template-areas:"q" "a"}
}
.ticket{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
.ticket .tno{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.ticket b{font-size:15px}
.reqline{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px dashed var(--line);font-size:14.5px;line-height:1.45}
.reqline .ava{width:34px;height:34px;border-radius:50%;background:var(--c4);flex:none;overflow:hidden}
.reqline b{font-size:12px;color:var(--ink2);display:block;font-weight:700}
.qbody{padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.answers{display:grid;gap:8px}
.answers.a2,.answers.a4,.answers.alist{grid-template-columns:1fr 1fr}
.answers.a3{grid-template-columns:repeat(3,1fr)}
.ans{min-height:52px;border-radius:var(--r);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);line-height:1.25;padding:4px 8px;text-align:center}
.ans:active{border-color:var(--accent)}
.ans small{font-size:12px;font-weight:600;color:var(--ink2)}
.ans[disabled]{opacity:.55}
.answers.alist .ans:last-child:nth-child(odd){grid-column:1 / -1}
.kids .ans{border:none;box-shadow:0 3px 0 rgba(78,66,58,.12);font-size:17px}
.kids .answers .ans:nth-child(5n+1){background:var(--c1)} .kids .answers .ans:nth-child(5n+2){background:var(--c2)} .kids .answers .ans:nth-child(5n+3){background:var(--c3)} .kids .answers .ans:nth-child(5n+4){background:var(--c4)} .kids .answers .ans:nth-child(5n+5){background:var(--c5)}
.kids .answers.a3 .ans{font-size:22px;min-height:58px}
.kids .ans.cand{background:var(--surface)!important;min-height:76px;font-size:14px}
.ans.cand .pic{width:56px;height:42px}
.adult .ans .key{font-family:var(--mono);font-size:11px;color:var(--ink2);font-weight:600}
.banner{border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.55}
.banner.ok{background:var(--okSoft);border:1px solid var(--ok)}
.banner.ng{background:var(--ngSoft);border:1px solid var(--ng)}
.banner .bh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.banner .bh .pic{width:34px;height:36px}
.banner .btn{min-height:48px}
.two-note{background:var(--accentSoft);border-radius:var(--r);padding:8px 12px;text-align:center;font-size:14px;line-height:1.5}
.timer{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:4px}
.timer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.timer.low i{background:var(--ng)}

/* 指示書（こども：やわらかいメモ ／ おとな：手順書） */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 14px}
.paper h3{margin:0;font-size:17px}
.paper .sub{font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
.paper .how{background:var(--warnSoft);border-radius:var(--rs);padding:6px 10px;font-size:13.5px;line-height:1.55;margin-bottom:10px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rule{display:flex;gap:10px;align-items:flex-start;border-radius:var(--rs);padding:8px 8px;border:1px solid transparent;position:relative;line-height:1.55;font-size:15px}
.rnum{flex:none;font-weight:800}
.rbody{flex:1;min-width:0}
.rexc{margin-top:4px;border-radius:var(--rs);padding:3px 8px;font-size:14.5px}
.rule.hl{border-color:var(--ng)!important;background:var(--ngSoft)!important}
.rule.ok-hl{border-color:var(--ok)!important;background:var(--okSoft)!important}
.newtag{position:absolute;top:-8px;right:8px;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--warn);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 9px;font-weight:800;vertical-align:middle;background:var(--accentSoft)}
.chip .pic{width:22px;height:18px}
.chip.long{border-radius:var(--rs);padding:2px 8px;display:inline;line-height:1.6;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.kids .paper{background:#FFFDF8;background-image:repeating-linear-gradient(transparent 0 29px,#F3EBDD 29px 30px)}
.kids .rule{background:rgba(255,255,255,.9)}
.kids .rnum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--c1)}
.kids .rule:nth-child(5n+2) .rnum{background:var(--c3)} .kids .rule:nth-child(5n+3) .rnum{background:var(--c2)} .kids .rule:nth-child(5n+4) .rnum{background:var(--c4)} .kids .rule:nth-child(5n+5) .rnum{background:var(--c5)}
.kids .rexc{background:var(--c5)}
.kids .rule.fb{border:1px dashed var(--line)}
.kids .chip.A{background:var(--c1)} .kids .chip.B{background:var(--c2)} .kids .chip.C{background:var(--c3)} .kids .chip.yes{background:var(--c1)} .kids .chip.no{background:var(--c3)} .kids .chip.p{background:var(--c4)}
.adult .paper{border-radius:4px;padding:14px 14px 16px;box-shadow:none}
.adult .paper h3{font-size:16px;letter-spacing:.04em;border-bottom:2px solid var(--ink);padding-bottom:6px}
.adult .paper .sub{font-family:var(--mono);font-size:11.5px}
.adult .paper .how{background:none;border-left:3px solid var(--accent);border-radius:0;padding:2px 10px;color:var(--ink2)}
.adult .rules{gap:0}
.adult .rule{border-radius:0;border:none;border-bottom:1px solid var(--line);padding:9px 4px;font-size:14.5px}
.adult .rnum{font-family:var(--mono);font-size:12.5px;color:var(--accent);min-width:46px;padding-top:2px}
.adult .rexc{border-left:2px solid var(--warn);border-radius:0;padding:1px 8px;margin-left:2px;background:none}
.adult .rule.fb .rnum{color:var(--ink2)}
.adult .chip{border-radius:3px;background:var(--accentSoft);color:var(--accent);font-weight:700;padding:0 6px}
.adult .newtag{border-radius:2px}
.paper .clip{display:none}

/* 問題の中身 */
.belt{position:relative;width:min(170px,46vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.belt::after{content:"";position:absolute;left:-8%;right:-8%;bottom:4%;height:10px;border-radius:999px;background:#EFE5D5;z-index:0}
.parcel{position:relative;z-index:1}
.parcel .pic{width:100%;height:100%}
.parcel .ov,.pkg .ov{position:absolute;inset:0;width:100%;height:100%}
.size-tag{position:absolute;top:0;left:0;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700}
.board{background:var(--warnSoft);border-radius:var(--rs);padding:4px 12px;font-weight:700;font-size:14px;text-align:center;line-height:1.5}
.vcard{position:relative;width:100%;max-width:340px;display:flex;gap:10px;align-items:center}
.vface{width:64px;height:64px;border-radius:50%;flex:none;overflow:hidden;font-size:40px;background:var(--c2)}
.vtable{flex:1;font-size:15px;line-height:1.3}
.vtable div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted var(--line);padding:3px 0;align-items:center}
.vtable span{color:var(--ink2);font-size:13px}
.tkt{display:inline-block;padding:0 10px;border-radius:4px;font-weight:700;color:#fff}
.hanko{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.hanko.yes{border:2px solid #D98F82;color:#D98F82;transform:rotate(-12deg)}
.hanko.no{border:2px dashed #CDBFAE;color:#B9AA98;font-size:11px}
.bigstamp{position:absolute;right:0;top:20%;padding:4px 12px;border-radius:10px;font-size:22px;font-weight:800;border:3px solid;background:rgba(255,255,255,.9);transform:rotate(-12deg);z-index:3}
.bigstamp.yes{color:var(--ok);border-color:var(--ok)} .bigstamp.no{color:var(--ng);border-color:var(--ng)}
.people{display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;vertical-align:middle}
.people i{width:9px;height:9px;border-radius:50%;background:#E9A98F;display:block}
.letter{width:100%;max-width:360px;font-size:15.5px;line-height:1.75}
.letter p{margin:0}
.letter .to{font-weight:700}
.letter .sig{text-align:right;font-weight:700}
.kids .letter{background:#FFFDF8;border:1px solid var(--line);border-radius:var(--rs);padding:8px 12px;background-image:repeating-linear-gradient(transparent 0 26px,#F3EBDD 26px 27px);line-height:27px}
.mailbox{width:100%;font-size:14.5px;line-height:1.7}
.mailbox .subj{font-weight:800;border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:4px}
.mailbox p{margin:0 0 2px}
.ctx{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.ctx div{display:flex;flex-direction:column;padding:2px 0;border-bottom:1px dotted var(--line);line-height:1.3}
.ctx span{color:var(--ink2);font-size:12px}
.ctx b{font-size:14.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;text-align:center}
.tbl th{font-size:12px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line);padding:4px 2px}
.tbl td{padding:7px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-weight:600}
.tbl td.rn{font-family:var(--mono);font-size:12px;color:var(--ink2);font-weight:400}
.tbl tr.picked td{background:var(--warnSoft)}
.tbl tr.right td{background:var(--okSoft)}
.pkg{position:relative;width:min(150px,40vw);aspect-ratio:1}
.pkg .pic{width:100%;height:100%}
.info{display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center}
.info span{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:13.5px}
.fields{width:100%;display:grid;grid-template-columns:auto 1fr;gap:0;font-size:14px}
.fields span{color:var(--ink2);padding:4px 10px 4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.fields b{padding:4px 0;border-bottom:1px solid var(--line);font-weight:600}

/* オーバーレイ */
.ovl{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,35,30,.28);padding:16px}
.ovl.on{display:flex}
.ovl .card{width:100%;max-width:460px;max-height:100%;overflow-y:auto;animation:popUp .2s ease}
.intro-ai{display:flex;align-items:center;gap:10px}
.intro-ai .pic{width:56px;height:60px;flex:none}
.newrule{background:var(--warnSoft);border-radius:var(--rs);padding:10px;margin:10px 0}
.newrule b{display:block;margin-bottom:6px}
.rev{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.rev td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:top}
.rev .mk{font-weight:800;width:28px}
.rev .mk.ok{color:var(--ok)} .rev .mk.ng{color:var(--ng)}
.toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:var(--rs);padding:8px 16px;font-weight:700;font-size:14px;z-index:32;display:none;white-space:nowrap}
.toast.on{display:block;animation:fadeIn .2s ease}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.center-col .pic{width:110px;height:120px}
.res-stars{display:flex;justify-content:center;gap:6px}
.res-stars svg{width:44px;height:44px}
.score{width:100%;max-width:360px;border-collapse:collapse;margin:10px 0;font-size:15px}
.score td{border-bottom:1px solid var(--line);padding:10px 4px}
.score td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
.mv-tabs{display:grid;gap:6px;margin-bottom:10px;flex:none}
.mv-tabs button{min-height:44px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.mv-tabs button.sel{border-color:var(--accent);background:var(--accentSoft)}
.how-list{line-height:1.8;padding-left:1.3em;margin:8px 0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popUp{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-height:700px){.t-title{font-size:26px}.aud{min-height:100px}.t-wrap{gap:12px}}
[hidden]{display:none!important}

.t-demo{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}

.ptype{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:2px;vertical-align:1px}

.tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:6px;background:var(--surface);border-bottom:1px solid var(--line)}

.thread{display:flex;flex-direction:column;gap:6px;padding:10px}
.msg{display:flex;flex-direction:column;max-width:86%}

.msg.u .bb{background:#F0ECE5;border-bottom-left-radius:4px}

.nametag{position:absolute;right:-6px;top:6px;background:#fff;border:1px solid var(--ink2);border-radius:3px;font-size:12px;font-weight:700;padding:0 6px;transform:rotate(8deg)}
.ctxv{padding:10px;display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;font-weight:700;color:var(--ink2);margin-top:6px;letter-spacing:.04em}

.logl{font-size:14px;line-height:1.5;padding:4px 0;border-bottom:1px dotted var(--line)}
.logl span{display:block;font-size:11.5px;color:var(--ink2)}
.pic.mini{width:26px;height:22px;vertical-align:middle;margin-right:4px}
.replies{display:grid;gap:6px}
.ans.rep{flex-direction:row;justify-content:flex-start;align-items:center;text-align:left;gap:8px;min-height:46px;padding:5px 10px;font-weight:600;font-size:14px;line-height:1.4}

.intro-p{display:flex;gap:12px;align-items:center}
.intro-p .pic{width:60px;height:60px;flex:none}
.sec{font-size:12.5px;font-weight:800;color:var(--accent);margin:10px 0 4px;letter-spacing:.04em}

.rout{color:var(--accent);font-weight:700}
.adult .rout{font-weight:600}
.banner.warn{background:var(--warnSoft);border:1px solid var(--warn)}
.banner .dm{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink2)}
.judge{font-size:13.5px}
.judge .o{color:var(--ok);font-weight:800} .judge .x{color:var(--ng);font-weight:800}

/* こども：明るいメッセンジャー ／ おとな：業務チャット */

.banner{border-radius:var(--r);padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14.5px;line-height:1.5}

<!-- =====================================================================
  ゲームのルール計算（画面とは関係のない部分）。
  指示書の文章と正解は、ここにある同じルールデータから作られます。
  test.js は、この下の logic という名前のスクリプトだけを取り出してテストします。
====================================================================== -->
<script id="logic">
var AIGame = (function () {
  'use strict';

  // ---------- 乱数（同じ種なら同じ結果 → 2台のスマホで同じ指示書） ----------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  }
  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function seededRng(str) { return mulberry32(xmur3(str)()); }
  function pick(rng, a) { return a.length ? a[Math.floor(rng() * a.length)] : null; }
  function ri(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
  function shuffle(rng, a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
  // {かな|漢字} → むずかしさに合わせてどちらかを使う
  function T(s, kanji) { return String(s).replace(/\{([^|{}]*)\|([^|{}]*)\}/g, function (m, k, j) { return kanji ? j : k; }); }
  function V(a, t, c) { return { a: a, t: t, c: c }; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function hm(m) { return Math.floor(m / 60) + ':' + pad2(m % 60); }

  // ---------- 日付 ----------
  var WD_K = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'], WD_J = ['日', '月', '火', '水', '木', '金', '土'];
  function addDays(d, n) { return new Date(d.getTime() + n * 86400000); }
  function dk(d) { return d.getUTCDate() + 'にち（' + WD_K[d.getUTCDay()] + '）'; }
  function dj(d) { return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日（' + WD_J[d.getUTCDay()] + '）'; }
  function weekdayToday(rng) { for (;;) { var d = new Date(Date.UTC(2026, 10, 2 + ri(rng, 0, 50))); var w = d.getUTCDay(); if (w >= 1 && w <= 4) return d; } }
  function satOffset(d) { return 6 - d.getUTCDay(); }

  // ---------- こども／おとな × むずかしさ ----------
  // counts は「とくべつな ルール」の数（レベル1→2→3）。指示書にはこれに各項目の「ふだんの読み方」が加わる
  var LEVELS = {
    kids: {
      easy:   { id: 'easy',   label: 'かんたん',   hint: '1・2年生から', counts: [1, 2, 2], maxTier: 1, kanji: false, n: 5 },
      normal: { id: 'normal', label: 'ふつう',     hint: '3・4年生から', counts: [2, 3, 4], maxTier: 2, kanji: true,  n: 5 },
      hard:   { id: 'hard',   label: 'むずかしい', hint: '5・6年生から', counts: [3, 4, 5], maxTier: 3, kanji: true,  n: 5 }
    },
    adults: {
      easy:   { id: 'easy',   label: 'かんたん',   hint: 'はじめての方に',       counts: [2, 3, 4], maxTier: 1, kanji: true, n: 5 },
      normal: { id: 'normal', label: 'ふつう',     hint: '慣れてきた方に',       counts: [4, 5, 6], maxTier: 2, kanji: true, n: 5 },
      hard:   { id: 'hard',   label: 'むずかしい', hint: 'じっくり考えたい方に', counts: [6, 7, 8], maxTier: 3, kanji: true, n: 7 }
    }
  };

  /* =================================================================
     ★ 機嫌メーターの設定（試験的。ここの数字を変えると調整できます）
       max     … 機嫌のいちばん高い段階（スタートもここ）
       content … 内容がちがったときに下がる量
       tone    … 内容は合っていて、言い方だけちがったときに下がる量
       perfect … 内容も言い方も合っていたときに上がる量（max より上にはならない）

  ================================================================= */
  var MOOD = {
    kids:   { easy: { max: 6, content: 1, tone: 0, perfect: 1 }, normal: { max: 5, content: 2, tone: 1, perfect: 1 }, hard: { max: 4, content: 2, tone: 1, perfect: 1 } },

  };
  function moodStep(mood, result, aud, diff) {
    var s = MOOD[aud][diff];
    if (result === 'perfect') return Math.min(s.max, mood + s.perfect);

  var AUDS = { kids: { id: 'kids', label: 'こども' }, adults: { id: 'adults', label: 'おとな' } };

    table: { id: 'table', kids: 'ひょうを よむ',   adults: '表を読む',   kidsSub: 'てんきよほうの ひょうを よむ', adultsSub: '天気予報の表と予定表を照らし合わせます' }
  };
  var ORDER = { kids: { pic: ['snack'], text: ['are'], table: ['kweather'] }, adults: { pic: ['lost'], text: ['doc'], table: ['aweather'] } };
  // ユーザーの話し方（2タイプ）
  var PERSONAS = {
    kids: {
      zakkuri:  { id: 'zakkuri',  type: 'ざっくりさん', name: 'ゆうと', emoji: '👦', note: 'みじかく ざっくり きく おとうと' },
      yurufuwa: { id: 'yurufuwa', type: 'ゆるふわさん', name: 'ミミ',   emoji: '👧', note: 'きもちを いっぱい つたえる いもうと' }
    },
    adults: {
      zakkuri:  { id: 'zakkuri',  type: 'ざっくりさん', name: '田所部長', emoji: '🧔', note: '用件を一言で済ませる上司' },
      yurufuwa: { id: 'yurufuwa', type: 'ゆるふわさん', name: '小春さん', emoji: '👩', note: '絵文字多めで気持ちを全部書く同僚' }
    }
  };

  // ---------- 言い回しの部品 ----------
  function sayK(w) { return V('「' + w + '」と いった', '「' + w + '」と いって', '「' + w + '」と いったら'); }
  function sayA(w) { return V('「' + w + '」と言われた', '「' + w + '」と言われて', '「' + w + '」と言われたら'); }
  function E(k, v) { return { k: k, op: 'eq', v: v }; }
  function R(slot, tier, conds, out) { return { slot: slot, tier: tier, conds: conds, out: out, kind: conds.length > 1 ? 'and' : 'single' }; }
  function D(slot, conds, out) { return { slot: slot, tier: 0, conds: conds, out: out, def: true, kind: 'default' }; }
  function facts(def) {
    var keys = Object.keys(def), out = [{}];
    keys.forEach(function (k) { var nx = []; out.forEach(function (o) { for (var v = 0; v < def[k]; v++) { var c = Object.assign({}, o); c[k] = v; nx.push(c); } }); out = nx; });
    return out;
  }
  // 気持ちのことば（ゆるふわさん）・いそぎのことば
  var EMO_K = ['どうしよう〜💦', 'しんぱいだよ〜😢', 'こまった〜😭'];
  var EMO_A = ['どうしよう〜💦', '不安です…😢', '困りました😭'];
  var HURRY_K = ['いそいでる！', 'はやく おしえて！'];
  var HURRY_A = ['急ぎで。', '手短に。'];
  var FLUFF_K = ['ねえねえ', 'あのね〜', 'えへへ'], FLUFF_A = ['お疲れさまです〜✨', 'すみません〜🙏', 'あの〜'];
  var KIND_K = ['しんぱいだよね。だいじょうぶ！', 'こまったね。いっしょに みよう！'];
  var KIND_A = ['ご不安ですよね。確認しました。', 'お困りですよね、すぐ確認しました。'];

  // こどもの「言い方」と おとなの「言い方」のルール（どのテーマも共通）
  function toneLib(aud) {
    var L = [R('tone', 3, [E('boss', 1)], 'kind'), R('tone', 2, [E('hurry', 1)], 'plain'), R('tone', 1, [E('emo', 1)], 'kind')];

  var TONE_SAY = {
    kids: {
      emo: [null, V('「💦」「😢」や「どうしよう」などが ある', '「💦」「😢」や「どうしよう」などが あって', '「💦」「😢」や「どうしよう」などが あれば')],

      return;
    }
    if (h === '#kids' || h === '#adults') { S.aud = h.slice(1); renderDiff(); show('scr-diff'); return; }
    renderTitle(); show('scr-title');
  }
  function goHash(h) { if (location.hash === h) route(); else location.hash = h; }
  function toTitle() { try { history.pushState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } route(); }

  // ---------- ボタンの動き ----------
  var A = {
    aud: function (b) { goHash('#' + b.dataset.v); },
    diffPick: function (b) { save.diff[S.aud] = b.dataset.v; persist(); renderGenre(); show('scr-genre'); },
    genrePick: function (b) { save.genre[S.aud] = b.dataset.v; persist(); renderSelect(); show('scr-select'); },
    diffSel: function (b) { save.diff[S.aud] = b.dataset.v; persist(); renderSelect(); },
    toDiff: function () { renderDiff(); show('scr-diff'); },
    toGenre: function () { renderGenre(); show('scr-genre'); },
    two: function () { save.two = !save.two; persist(); renderTitle(); },
    timer: function () { save.timer = !save.timer; persist(); renderDiff(); },
    sound: function () { save.sound = !save.sound; persist(); Snd.unlock(); renderTitle(); if (save.sound) Snd.chime(); },
    toSelect: function () { clearTimers(); S.game = null; renderSelect(); show('scr-select'); },
    toTitle: toTitle,
    howto: howto, hideOvl: hideOvl,
    toManual: function () { goHash('#manual'); },
    mvBack: toTitle,
    mvAud: function (b) { var g = G.THEMES[S.mv.theme].genre; S.mv.theme = themesOf(b.dataset.v, g)[0]; setManualHash(); renderManualView(); },
    mvGenre: function (b) { S.mv.theme = themesOf(G.THEMES[S.mv.theme].aud, b.dataset.v)[0]; setManualHash(); renderManualView(); },
    mvDiff: function (b) { S.mv.diff = b.dataset.v; setManualHash(); renderManualView(); },
    mvLevel: function (b) { S.mv.level = +b.dataset.v; setManualHash(); renderManualView(); },
    start: function (b) { startStage(b.dataset.t, +b.dataset.l); },
    locked: function () { toast(U('まえの レベルを クリアしてね', '前のレベルをクリアしてください')); },
    begin: function () { hideOvl(); var g = S.game; if (g) { g.t0 = Date.now(); if (g.timer) startTimer(); } },
    tab: function (b) { var g = S.game; if (!g) return; g.tab = b.dataset.v; $('thread').hidden = g.tab !== 'chat'; $('ctxv').hidden = g.tab !== 'ctx'; var bs = document.querySelectorAll('.tabs button'); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('sel', bs[i].dataset.v === g.tab); var qp = $('qpane'); qp.scrollTop = g.tab === 'chat' ? qp.scrollHeight : 0; },
    split: function (b) {
      save.split = b.dataset.v; persist();
      var gb = $('gbody'); if (gb) gb.className = gb.className.replace(/split-\w/, 'split-' + save.split);
      var bs = document.querySelectorAll('.splitbar button'); for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('sel', bs[i].dataset.v === save.split);
    },
    answer: function (b) { answer(b.dataset.v); },
    afterFb: function () { next(); },
    resume: function () {
      var g = S.game; hideOvl(); if (!g) return;
      g.quitOpen = false;
      if (g.pendingNext) { g.pendingNext = false; next(); }
      else if (g.savedOvl) showOvl(g.savedOvl);
      g.savedOvl = null;
    },
    quit: function () {
      var g = S.game, o = $('ovl');
      if (g) { g.quitOpen = true; g.savedOvl = o.classList.contains('on') ? o.innerHTML : null; }
      showOvl('<div class="card" style="text-align:center"><h2>' + U('チャットを やめる？', 'チャットを中断しますか？') + '</h2><div class="row"><button class="btn" data-act="resume">' + U('つづける', '続ける') + '</button><button class="btn primary" data-act="toSelect">' + U('やめる', '中断する') + '</button></div></div>');
    }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.disabled) return;
    var f = A[b.dataset.act]; if (!f) return;
    if (b.dataset.act !== 'answer') Snd.pop();
    f(b);
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>

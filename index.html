<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>あなたはAIです</title>
<style>
/* ===== ひとつにまとめたデザイン：チャットアプリ風・落ち着いた紙色に、深い青緑1色 ===== */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --ink:#2A2724; --ink2:#6E675E; --line:#E2DCD1;
  --accent:#1F6B6E; --accentInk:#FFFFFF; --accentSoft:#E1EEEC;
  --ok:#3F8460; --okSoft:#E3F0E7; --ng:#B25B52; --ngSoft:#F7E6E3; --warn:#A97F22; --warnSoft:#F7EED8;
  --r:12px; --rs:8px; --shadow:0 1px 2px rgba(40,30,20,.06);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",system-ui,sans-serif;
  --mono:"SFMono-Regular","Menlo","Consolas","Hiragino Sans",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E7E2D9;font-size:15px;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;overflow:clip;box-shadow:0 0 30px rgba(0,0,0,.06)}
@media (min-width:700px){#app.wide{max-width:1100px}}
button{font-family:inherit;color:inherit;font-size:15px;touch-action:manipulation;cursor:pointer;border:none;background:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px)}
.scr.on{display:flex;animation:fadeIn .2s ease}
.narrow{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:var(--r);font-weight:700;background:var(--surface);border:1px solid var(--line)}
.btn:active{filter:brightness(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.btn.big{min-height:54px;font-size:17px}
.row{display:flex;gap:10px} .row>*{flex:1}
.icon-btn{width:44px;height:44px;border-radius:var(--rs);background:var(--surface);border:1px solid var(--line);font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.muted{color:var(--ink2);font-size:13px}
h2{margin:4px 0 8px;font-size:19px;text-align:center}
.pic{display:inline-flex;align-items:center;justify-content:center}
.pic img,.pic svg{width:100%;height:100%;object-fit:contain;display:block}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:none;min-height:44px}
.hdr .ttl{flex:1;text-align:center;font-weight:700}
.badge{display:inline-block;background:var(--accentSoft);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
ruby rt{font-size:.5em;color:var(--ink2)}

/* タイトル */
.t-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.t-head{display:flex;align-items:center;gap:14px}
.t-head .pic{width:60px;height:60px;flex:none}
.t-title{font-size:30px;font-weight:800;line-height:1.15}
.t-title em{font-style:normal;color:var(--accent)}
.t-sub{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.t-demo{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:6px 14px;width:100%;text-align:left}
.tog+.tog{border-top:1px solid var(--line)}
.tog b{font-size:14.5px} .tog small{display:block;font-size:12px;color:var(--ink2)}
.sw{width:44px;height:26px;border-radius:999px;background:#D6CFC4;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tog.on .sw{background:var(--accent)} .tog.on .sw::after{left:21px}
.two-help{background:var(--accentSoft);border-radius:var(--r);padding:10px 14px;font-size:13.5px;line-height:1.6}
.two-help ol{margin:4px 0 0;padding-left:1.3em}
.linkrow{display:flex;gap:10px} .linkrow .btn{flex:1;font-weight:600}

/* レベルえらび */
.lvlist{display:grid;gap:8px}
.lvb{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:8px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.lvb .no{width:44px;height:44px;border-radius:10px;background:var(--accentSoft);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;flex:none;line-height:1}
.lvb .no small{font-size:10px;font-weight:700}
.lvb b{font-size:15px;display:block}
.lvb .sub{font-size:12px;color:var(--ink2)}
.lvb .rt{margin-left:auto;text-align:right;font-size:12px;color:var(--ink2);flex:none}
.lvb .st{color:var(--warn);font-size:13px;letter-spacing:1px}
.lvb.locked{opacity:.5}
.lvb.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}

/* ゲーム画面 */
.gtop{display:flex;align-items:center;gap:8px;flex:none;min-height:44px;margin-bottom:6px}
.gtop .ttl{flex:1;min-width:0;line-height:1.3}
.gtop .ttl b{font-size:14px}
.ptag{font-size:11px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:3px;vertical-align:1px;background:var(--surface)}
.who{position:relative;width:38px;height:38px;flex:none}
.who .pic{width:100%;height:100%}
.who .angry{position:absolute;right:-4px;bottom:-4px;font-size:15px}
.who.big{width:80px;height:80px}
.gnum{flex:none;text-align:right;font-size:12.5px}
.prog{display:flex;gap:3px;justify-content:flex-end;margin-top:3px}
.prog i{width:7px;height:5px;border-radius:3px;background:var(--line);display:block}
.prog i.ok{background:var(--ok)} .prog i.ng{background:var(--ng)} .prog i.wait{background:var(--warn)} .prog i.cur{background:var(--accent)}
.mood{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);white-space:nowrap}
.mood .face{font-size:15px;line-height:1}
.mood .dots{display:flex;gap:2px}
.mood .dots em{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.mood .dots em.on{background:#E2A73A}
.gbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"q" "s" "m" "a";gap:6px}
.qpane{grid-area:q;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#FBFAF7;border:1px solid var(--line);border-radius:var(--r);max-height:calc((100dvh - 280px) * .52);min-height:100px}
.split-q .qpane{max-height:calc((100dvh - 280px) * .8)}
.split-m .qpane{max-height:calc((100dvh - 280px) * .26)}
.splitbar{grid-area:s;display:flex;gap:4px}
.splitbar button{flex:1;min-height:30px;border-radius:var(--rs);border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.splitbar button.sel{background:var(--accentSoft);color:var(--ink);border-color:var(--accentSoft)}
.mpane{grid-area:m;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:var(--r);min-height:0}
.abar{grid-area:a}
.gbody.two{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"q" "a"}
.gbody.two .qpane{max-height:none}
@media (min-width:700px){
  #app.wide .gbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"q m" "a m";gap:12px}
  #app.wide .qpane{max-height:none}
  #app.wide .splitbar{display:none}
  #app.wide .gbody.two{grid-template-columns:minmax(0,640px);justify-content:center;grid-template-areas:"q" "a"}
  #app.wide .replies{grid-template-columns:1fr 1fr}
}
/* 参照情報（たためる帯） */
.ctxbar{position:sticky;top:0;z-index:2;background:#F1EEE7;border-bottom:1px solid var(--line)}
.ctxbar>button{display:flex;align-items:center;gap:6px;width:100%;min-height:34px;padding:4px 10px;font-size:12.5px;text-align:left;color:var(--ink2)}
.ctxbar>button b{color:var(--ink);font-weight:700;white-space:nowrap}
.ctxbar>button .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctxv{padding:4px 10px 10px;display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:52vh;overflow-y:auto}
.cap{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:6px;letter-spacing:.04em}
.fields{display:grid;grid-template-columns:auto 1fr;font-size:13px}
.fields span{color:var(--ink2);padding:3px 10px 3px 0;border-bottom:1px solid var(--line);font-size:12px}
.fields b{padding:3px 0;border-bottom:1px solid var(--line);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;text-align:center}
.tbl th{font-size:11px;color:var(--ink2);font-weight:700;border-bottom:1px solid var(--line);padding:3px 2px}
.tbl td{padding:4px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.grow{display:flex;align-items:center;gap:2px;padding:2px 0;border-bottom:1px dotted var(--line)}
.grow span{width:68px;flex:none;font-size:12px;font-weight:700}
.grow .gi{width:28px;height:24px}
.logl{font-size:13px;line-height:1.45;padding:3px 0;border-bottom:1px dotted var(--line)}
.logl span{display:block;font-size:11px;color:var(--ink2)}
/* チャット：ユーザー＝左の白、アイ＝右の青緑、まわりの人・システム＝点線や中央 */
.thread{display:flex;flex-direction:column;gap:5px;padding:8px 10px}
.msg{display:flex;flex-direction:column;max-width:86%}
.msg .bb{padding:7px 11px;border-radius:14px;font-size:14.5px;line-height:1.5;word-break:break-word}
.msg.u,.msg.o{align-self:flex-start}
.msg.u .bb{background:#FFFFFF;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.o .bb{background:transparent;border:1px dashed #CFC7BA;font-size:13px;color:var(--ink2)}
.msg.a{align-self:flex-end}
.msg.a .bb{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.r .bb{font-size:13.5px}
.msg.r.content .bb{background:var(--ngSoft);border-color:#E8C9C4} .msg.r.tone .bb{background:var(--warnSoft);border-color:#EADCB5} .msg.r.perfect .bb{background:var(--okSoft);border-color:#C9E0D0}
.msg .tm{font-size:10.5px;color:var(--ink2);margin:0 0 1px 4px;font-family:var(--mono)}
.sys{align-self:center;font-size:11.5px;color:var(--ink2);background:#EDE9E1;border-radius:999px;padding:2px 10px}
.photo{position:relative;width:110px;height:110px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:3px;padding:8px}
.photo .pic{width:100%;height:100%}
.nametag{position:absolute;right:-6px;top:6px;background:#fff;border:1px solid var(--ink2);border-radius:3px;font-size:11px;font-weight:700;padding:0 5px;transform:rotate(8deg)}
.pic.mini{width:22px;height:18px;vertical-align:middle;margin-right:3px}
/* 指示書 */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px 10px}
.paper h3{margin:0;font-size:15px}
.paper .sub{font-size:11.5px;color:var(--ink2);margin:2px 0 6px;font-family:var(--mono)}
.paper .how{border-left:3px solid var(--accent);padding:2px 8px;color:var(--ink2);font-size:12.5px;line-height:1.5;margin-bottom:4px}
.sec{font-size:11.5px;font-weight:800;color:var(--accent);margin:8px 0 2px;letter-spacing:.04em}
.rules{list-style:none;margin:0;padding:0}
.rule{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-bottom:1px solid var(--line);position:relative;line-height:1.45;font-size:13.5px}
.rnum{flex:none;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:700;min-width:22px;padding-top:2px}
.rbody{flex:1;min-width:0}
.rout{color:var(--accent);font-weight:700}
.rule.fb .rnum{color:var(--ink2)}
.rule.hl{background:var(--ngSoft)} .rule.ok-hl{background:var(--okSoft)}
.newtag{position:absolute;top:2px;right:4px;font-size:10px;font-weight:800;border-radius:3px;padding:0 5px;background:var(--warn);color:#fff}
.low .rule{font-size:14px}
/* 返事の候補 */
.replies{display:grid;gap:5px}
.ans.rep{display:flex;align-items:center;text-align:left;gap:8px;min-height:44px;padding:5px 10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.4;font-weight:500}
.ans.rep:active{border-color:var(--accent)}
.ans.rep .key{flex:none;width:22px;height:22px;border-radius:6px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-family:var(--mono);font-weight:800}
.ans.rep .rt2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ans[disabled]{opacity:.55}
.banner{border-radius:var(--r);padding:8px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13.5px;line-height:1.5}
.banner.ok{background:var(--okSoft);border:1px solid var(--ok)} .banner.warn{background:var(--warnSoft);border:1px solid var(--warn)} .banner.ng{background:var(--ngSoft);border:1px solid var(--ng)}
.banner .bt{flex:1 1 200px;min-width:0}
.banner .bh{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14.5px}
.banner .bh .pic{width:26px;height:28px}
.banner .dm{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink2)}
.banner>.btn{flex:0 0 auto;min-width:96px;margin-left:auto;min-height:44px}
.judge{font-size:12.5px} .judge .o{color:var(--ok);font-weight:800} .judge .x{color:var(--ng);font-weight:800}
.quip{font-size:12px;color:var(--ink2);font-style:italic}
.two-note{background:var(--accentSoft);border-radius:var(--r);padding:6px 10px;text-align:center;font-size:13px;line-height:1.5}
/* オーバーレイ・結果 */
.ovl{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(40,35,30,.3);padding:16px}
.ovl.on{display:flex}
.ovl .card{width:100%;max-width:460px;max-height:100%;overflow-y:auto;animation:popUp .2s ease}
.intro-p{display:flex;gap:12px;align-items:center}
.intro-p .who{width:56px;height:56px}
.newrule{background:var(--warnSoft);border-radius:var(--rs);padding:8px 10px;margin:10px 0;font-size:13.5px}
.newrule b{display:block;margin-bottom:4px}
.toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:var(--rs);padding:8px 16px;font-weight:700;font-size:13.5px;z-index:32;display:none;white-space:nowrap}
.toast.on{display:block}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.res-stars{display:flex;justify-content:center;gap:6px}
.res-stars svg{width:40px;height:40px}
.score{width:100%;max-width:360px;border-collapse:collapse;margin:8px 0;font-size:14px}
.score td{border-bottom:1px solid var(--line);padding:8px 4px}
.score td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;margin-bottom:8px;gap:2px}
.seg button{flex:1 0 auto;min-height:36px;border-radius:calc(var(--r) - 3px);font-weight:700;font-size:13px;padding:2px 8px}
.seg button.sel{background:var(--accent);color:#fff}
.how-list{line-height:1.7;padding-left:1.3em;margin:8px 0;font-size:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popUp{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== ゲーム画面（タブ式） ===== */
.gbody{grid-template-rows:auto auto minmax(0,1fr) auto!important;grid-template-areas:"n" "t" "p" "a"!important;gap:6px!important}
.nowq{grid-area:n;background:#FBFAF7;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px 8px;max-height:32vh;overflow-y:auto}
.nowl{display:block;font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.nowq .msg{max-width:100%}
.nowq .bb{font-size:15.5px;font-weight:600}
.tabs{grid-area:t;display:flex;gap:4px}
.tabs button{flex:1;min-height:42px;border-radius:var(--rs);font-size:14px;font-weight:700;color:var(--ink2);border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tabs button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.pane{grid-area:p;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none;border-radius:var(--r)}
.tab-ctx .pctx,.tab-chat .pchat,.tab-man .pman{display:block}
.pchat{background:#FBFAF7;border:1px solid var(--line)}
.pchat.thread{display:none;flex-direction:column}
.tab-chat .pchat{display:flex;flex-direction:column}
.gbody.two{grid-template-rows:auto auto minmax(0,1fr) auto!important}
.ptag{white-space:nowrap}
@media (min-width:700px){
  #app.wide .gbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:auto auto minmax(0,1fr) auto!important;grid-template-areas:"n m" "t m" "p m" "a m"!important;gap:10px 14px!important}
  #app.wide .pman{grid-area:m;display:block}
  #app.wide .tabs .t-man{display:none}
  #app.wide .tab-man .pctx{display:block}
  #app.wide .gbody.two{grid-template-columns:minmax(0,640px)!important;grid-template-areas:"n" "t" "p" "a"!important}
}
/* わかっていること パネル（ひろく 見やすく） */
.pctx{padding:0;display:none;flex-direction:column;gap:8px;font-size:14px}
.tab-ctx .pctx{display:flex}
.csec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.csec h4{margin:0 0 6px;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:6px}
.csec .ci{font-size:16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:0;margin:0;font-size:14.5px}
.kv dt{color:var(--ink2);padding:6px 14px 6px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.kv dd{margin:0;padding:6px 0;border-bottom:1px dotted var(--line);font-weight:700;color:var(--ink)}
.csec .cap{font-size:13.5px;font-weight:700;color:var(--ink2);margin:6px 0 4px}
.note{margin:6px 0 0;font-size:14px;background:var(--warnSoft);border-radius:6px;padding:5px 8px}
.logs{list-style:none;margin:0;padding:0}
.logs li{font-size:14.5px;line-height:1.5;padding:6px 0;border-bottom:1px dotted var(--line)}
.logs li span{display:block;font-size:12.5px;color:var(--ink2)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tscroll .tbl{font-size:14.5px;width:auto;min-width:100%;border-collapse:collapse}
.tscroll .tbl th{font-size:13px;padding:7px 12px;white-space:nowrap;background:#F1EEE7;text-align:left}
.tscroll .tbl td{padding:8px 12px;white-space:nowrap;text-align:left}
.tscroll .tbl tr:nth-child(even) td{background:#FAF8F3}
.csec .grow span{width:84px;font-size:13.5px}
.csec .grow .gi{width:32px;height:28px}

<!-- =====================================================================

<script id="logic">
var AIGame = (function () {
  'use strict';

  // ---------- 乱数（同じ種なら同じ結果 → 2台のスマホで同じ指示書） ----------
  function xmur3(str) {

    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }

  }

  }
  function seededRng(str) { return mulberry32(xmur3(str)()); }

    var kind = res === 'perfect' ? 'perfect' : res === 'tone' ? (correct.tone === 'plain' ? 'long' : correct.tone === 'sorry' ? 'cold' : 'cold') : res === 'askBad' ? chosen.askBad : 'content';
    if (res === 'perfect' && q.askCorrect) kind = null;
    g.thread.push({ type: 'a', text: chosen.text, pic: chosen.pic });
    if (kind) g.thread.push({ type: 'r', res: res, text: reactLine(kind, K, g.user.style) });
    if (res === 'perfect') Snd.chime(); else Snd.oops();
    var hl = {};
    q.hits.forEach(function (h) { hl[h.index] = 'ok-hl'; });
    if (chosen.wrong) q.hits.forEach(function (h) { if (h.slot === chosen.wrong.slot) hl[h.index] = 'hl'; });
    if (res === 'tone') q.hits.forEach(function (h) { if (h.slot === 'tone') hl[h.index] = 'hl'; });
    var mp = $('mpane');
    if (mp) {
      mp.innerHTML = manualHtml(g.manual, { compact: true, hl: hl });
      var first = Object.keys(hl).filter(function (k) { return hl[k] === 'hl'; })[0] || q.target;
      var el = $('rule-' + first); if (el) mp.scrollTop = Math.max(0, el.offsetTop - 10);
    }
    $('thread').innerHTML = threadHtml(g);
    // まちがえたら しじしょ（あてはまる ルールに いろ）、あっていたら チャット（あいての はんのう）を見せる
    setTab(res === 'perfect' || g.two ? 'chat' : 'man');
    $('mood').innerHTML = moodHtml(g); $('prog').innerHTML = progHtml();
    $('abar').innerHTML = banner(q, res, chosen, correct, before);
    if (res === 'perfect' && !g.two) later(function () { if (S.game === g && g.qs[g.idx] === q) next(); }, q.askCorrect ? 900 : 1300);
  }
  function banner(q, res, chosen, correct, before) {
    var g = S.game, m = g.manual, k = g.sess.kana;
    var toneHit = q.hits.filter(function (h) { return h.slot === 'tone'; })[0];
    var cHits = q.hits.filter(function (h) { return h.slot !== 'tone'; }).map(function (h) { return pad2(h.index + 1); }).join('・');
    var cOk = res === 'perfect' || res === 'tone', tOk = res === 'perfect', d = g.mood - before;
    var h = '<div class="banner ' + (tOk ? 'ok' : res === 'tone' ? 'warn' : 'ng') + '"><div class="bt">';
    h += '<div class="bh">' + (tOk ? aiPic('happy') + (q.askCorrect ? U('じょうずに ききかえせた！', '適切な聞き返しです') : U('ばっちり！', '適切な返事です')) : res === 'askBad' ? aiPic('think') + (chosen.askBad === 'needless' ? U('ききかえさなくても わかったよ', '聞き返さなくても分かる内容でした') : U('いっぺんに ききすぎ', '聞き返し方があいまいです')) : res === 'tone' ? aiPic('think') + U('ないようは あってる！', '内容は正しく、言い方が合っていません') : aiPic('oops') + U('おしい！', '内容が違います')) + '<span class="dm">' + U('きげん ', '機嫌 ') + (d > 0 ? '+' + d : d === 0 ? '±0' : d) + '</span></div>';
    h += '<div class="judge"><span class="' + (cOk ? 'o' : 'x') + '">' + U('ないよう', '内容') + (cOk ? '○' : '×') + '</span> ' + U('ルール', '規則') + cHits + '　<span class="' + (tOk ? 'o' : 'x') + '">' + U('いいかた', '言い方') + (tOk ? '○' : '×') + '</span> ' + (toneHit ? U('ルール', '規則') + pad2(toneHit.index + 1) : '') + '</div>';
    if (!tOk) h += '<div class="muted">' + U('こたえ：', '正解：') + esc(correct.text) + '</div>';
    if (!tOk && chosen.wrong) h += '<div class="muted">' + U('「' + G.slotTitle(g.scene, chosen.wrong.slot, m.kanji) + '」の よみかたが ちがったよ。', '「' + G.slotTitle(g.scene, chosen.wrong.slot, m.kanji) + '」の解釈が違います。') + '</div>';
    if (!tOk) h += '<div class="quip">' + rnd(QUIP[k ? 'k' : 'j']) + '</div>';
    h += '</div><button class="btn primary" data-act="afterFb">' + (g.mood <= 0 ? '…' : U('つぎへ', '次へ')) + '</button></div>';
    return h;
  }
  function next() {
    var g = S.game; if (!g) return;
    if (g.quitOpen) { g.pendingNext = true; return; }
    hideOvl();
    if (g.mood <= 0) return gameOver();
    if (g.idx >= g.qs.length - 1) return finish();
    var cur = g.qs[g.idx], nx = g.qs[g.idx + 1];
    if (cur.askCorrect && nx.followOf === g.idx) nx.msgPrefix = g.results[g.idx] === 'content' ? U('ちがうよ、', 'いや、') : '';
    g.idx++;
    renderGame();
  }
  function finish() {
    var g = S.game; clearTimers();
    var ratio = g.mood / g.moodMax, stars = ratio >= 0.8 ? 3 : ratio >= 0.5 ? 2 : 1;
    var perfect = g.results.filter(function (r) { return r === 'perfect'; }).length, content = g.results.filter(function (r) { return r !== 'content'; }).length, time = Date.now() - (g.t0 || Date.now());
    var b = save.best[g.lv];
    if (!b || stars > b.stars || (stars === b.stars && perfect > b.perfect)) save.best[g.lv] = { stars: stars, perfect: perfect, n: g.qs.length, time: time };
    persist();
    Snd.fanfare();
    var u = g.user, st = ''; for (var i = 0; i < 3; i++) st += starSvg(i < stars);
    var body = '<div class="center-col">' + avatar(u, false).replace('class="who"', 'class="who big"') + '<div class="muted">Lv' + g.lv + '（' + G.L(g.lv).fit + 'レベル）クリア</div><h2 style="margin:2px 0">' + u.name + 'は ' + MOOD_FACE[moodIdx(g)] + ' ' + U(MOOD_WORD_K, MOOD_WORD)[moodIdx(g)] + '</h2><div class="res-stars">' + st + '</div>' +
      '<table class="score"><tr><td>' + U('ばっちりな へんじ', '適切な返事') + '</td><td>' + perfect + ' / ' + g.qs.length + '</td></tr><tr><td>' + U('ないようが あってた へんじ', '内容が正しかった返事') + '</td><td>' + content + ' / ' + g.qs.length + '</td></tr><tr><td>' + U('かかった じかん', '所要時間') + '</td><td>' + mmss(time) + '</td></tr></table></div>';
    var nextBtn = g.lv < 10 ? '<button class="btn primary big" style="width:100%" data-act="start" data-l="' + (g.lv + 1) + '">Lv' + (g.lv + 1) + 'へ</button>' : '';
    $('scr-result').innerHTML = '<div class="narrow">' + body + '<div style="display:grid;gap:8px">' + nextBtn + '<div class="row"><button class="btn" data-act="start" data-l="' + g.lv + '">' + U('もういちど（べつの ひと）', 'もう一度（別の相手）') + '</button><button class="btn" data-act="toLevels">' + U('レベル えらび', 'レベル選択') + '</button></div></div></div>';
    show('scr-result');
  }
  function gameOver() {
    var g = S.game, u = g.user, k = g.sess.kana ? 'k' : 'j'; clearTimers();
    var body = '<div class="center-col">' + avatar(u, true).replace('class="who"', 'class="who big"') + '<div class="muted">' + U('おはなし おしまい', '会話終了') + '</div><h2>' + u.name + U('は ' + rnd(LEAVE.k), 'が会話を終了しました') + '</h2><p style="line-height:1.7;font-size:14px">' + (k === 'j' ? rnd(LEAVE.j) + '<br>' : '') + '<span class="muted">' + U('しじしょを うえから よんで、もういちど やってみよう。', 'マニュアルを項目ごとに確認して、もう一度どうぞ。') + '</span></p></div>';
    $('scr-retry').innerHTML = '<div class="narrow">' + body + '<div style="display:grid;gap:8px"><button class="btn primary big" data-act="start" data-l="' + g.lv + '">' + U('もういちど', 'もう一度') + '</button><button class="btn" data-act="toLevels">' + U('レベル えらび', 'レベル選択') + '</button></div></div>';
    show('scr-retry');
  }

  // ---------- 指示書だけ（#manual-lv3 / #manual-lv3-gomi） ----------
  function scenesAt(lv) { return Object.keys(G.SCENES).filter(function (id) { return G.SCENES[id].minLv <= lv; }); }
  function renderManualView() {
    var mv = S.mv, list = scenesAt(mv.lv);
    if (list.indexOf(mv.scene) < 0) mv.scene = list[0];
    var h = '<div class="narrow">' + hdr('toTitle', '指示書だけ表示') + '<div class="scroll" style="flex:1">';
    h += '<p class="muted" style="margin:0 0 6px">チャット画面の「コード」と同じレベル・場面を選んでください。</p>';
    h += '<div class="seg">' + G.LEVELS.map(function (c) { return '<button class="' + (mv.lv === c.lv ? 'sel' : '') + '" data-act="mvLv" data-v="' + c.lv + '">Lv' + c.lv + '</button>'; }).join('') + '</div>';
    h += '<div class="seg">' + list.map(function (id) { return '<button class="' + (mv.scene === id ? 'sel' : '') + '" data-act="mvScene" data-v="' + id + '">' + id + '</button>'; }).join('') + '</div>';
    h += manualHtml(G.getManual(mv.scene, mv.lv)) + '</div></div>';
    $('scr-manual').innerHTML = h;
  }
  function setManualHash() { try { history.replaceState(null, '', '#manual-lv' + S.mv.lv + '-' + S.mv.scene); } catch (e) {} }
  function route() {
    var h = location.hash || '';
    var m = /^#manual(?:-lv(\d+))?(?:-([a-z]+))?$/.exec(h);
    clearTimers(); S.game = null;
    if (m) {
      if (m[1]) S.mv.lv = Math.max(1, Math.min(10, +m[1]));
      if (m[2] && G.SCENES[m[2]]) S.mv.scene = m[2];
      show('scr-manual'); renderManualView();
      return;
    }
    if (h === '#levels') { renderLevels(); show('scr-select'); return; }
    renderTitle(); show('scr-title');
    if (!save.tutSeen) howto(0);
  }
  function goHash(h) { if (location.hash === h) route(); else location.hash = h; }
  function toTitle() { try { history.pushState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } route(); }

  // ---------- ボタンの動き ----------
  var A = {
    toLevels: function () { goHash('#levels'); },
    toTitle: toTitle,
    two: function () { save.two = !save.two; persist(); renderTitle(); },
    sound: function () { save.sound = !save.sound; persist(); Snd.unlock(); renderTitle(); if (save.sound) Snd.chime(); },
    howto: function () { howto(0); }, hideOvl: hideOvl,
    tutGo: function (b) { howto(+b.dataset.v); },
    tutAdult: function () { save.tutAdult = !save.tutAdult; persist(); howto(S.tut || 0); },
    tutEnd: function () { save.tutSeen = true; persist(); hideOvl(); },
    toManual: function () { goHash('#manual'); },
    mvLv: function (b) { S.mv.lv = +b.dataset.v; renderManualView(); setManualHash(); },
    mvScene: function (b) { S.mv.scene = b.dataset.v; renderManualView(); setManualHash(); },
    start: function (b) { startStage(+b.dataset.l); },
    locked: function () { toast('前のレベルをクリアしてください'); },
    begin: function () { hideOvl(); if (S.game) S.game.t0 = Date.now(); },
    tab: function (b) { setTab(b.dataset.v); },
    answer: function (b) { answer(b.dataset.v); },
    afterFb: function () { next(); },
    resume: function () { var g = S.game; hideOvl(); if (!g) return; g.quitOpen = false; if (g.pendingNext) { g.pendingNext = false; next(); } },
    quit: function () {
      var g = S.game; if (g) g.quitOpen = true;
      showOvl('<div class="card" style="text-align:center"><h2>' + U('チャットを やめる？', 'チャットを中断しますか？') + '</h2><div class="row"><button class="btn" data-act="resume">' + U('つづける', '続ける') + '</button><button class="btn primary" data-act="toLevels">' + U('やめる', '中断する') + '</button></div></div>');
    }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    if (b.disabled) return;
    var f = A[b.dataset.act]; if (!f) return;
    if (b.dataset.act !== 'answer') Snd.pop();
    f(b);
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>

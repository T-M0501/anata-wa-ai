<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>あなたはAIです</title>
<style>
:root{
  --cream:#FFF8EC; --paper:#FFFDF7; --ink:#5B4A3F; --ink2:#8A7768;
  --mint:#CDEFE0; --mintD:#4FB58E; --peach:#FFDCCB; --peachD:#EE8F6B;
  --sky:#D6EAFB; --skyD:#5C9FDB; --butter:#FFEDB0; --butterD:#D9A920;
  --lav:#E6DDF8; --lavD:#9A82D6; --coral:#F7A59A; --coralBg:#FFEDE9;
  --shadow:0 4px 0 rgba(91,74,63,.10), 0 8px 20px rgba(91,74,63,.08);
  --r:22px;
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Rounded Mplus 1c","Yu Gothic","Meiryo",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#F6EBD7;color:var(--ink);font-family:var(--font);font-size:17px;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center;overscroll-behavior:none}
button{font-family:inherit;color:inherit;font-size:17px;touch-action:manipulation;cursor:pointer;border:none;-webkit-user-select:none;user-select:none}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--cream);overflow:hidden;box-shadow:0 0 40px rgba(91,74,63,.12)}
ruby rt{font-size:.5em;color:var(--ink2)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px)}
.scr.on{display:flex;animation:fadeIn .35s ease}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:18px;background:#fff;box-shadow:0 4px 0 rgba(91,74,63,.16);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,74,63,.16)}
.btn.mint{background:var(--mint)} .btn.peach{background:var(--peach)} .btn.sky{background:var(--sky)} .btn.butter{background:var(--butter)} .btn.lav{background:var(--lav)}
.btn.big{min-height:62px;font-size:21px}
.btn.small{min-height:48px;font-size:16px;padding:8px 14px}
.row{display:flex;gap:10px} .row>*{flex:1}
.icon-btn{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(91,74,63,.14);font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.muted{color:var(--ink2);font-size:15px}
h2{margin:4px 0 10px;font-size:22px;text-align:center}
.pic{display:inline-flex;align-items:center;justify-content:center}
.pic img,.pic svg{width:100%;height:100%;object-fit:contain;display:block}

/* ===== title ===== */
.logo{text-align:center;margin:6px 0 0}
.logo .l1{font-size:22px;letter-spacing:.1em;color:var(--ink2)}
.logo .l2{font-size:44px;font-weight:800;line-height:1.1}
.logo .ai-tag{display:inline-block;background:var(--mint);border-radius:18px;padding:0 12px;margin:0 4px;color:#2F7D60;box-shadow:0 4px 0 rgba(79,181,142,.35);animation:bob 2.4s ease-in-out infinite}
.hero{display:flex;justify-content:center;margin:2px 0}
.hero .pic{width:130px;height:140px;animation:bob 3s ease-in-out infinite}
.diffs{display:grid;gap:8px;margin:8px 0}
.diff{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;border-radius:20px;background:#fff;box-shadow:0 3px 0 rgba(91,74,63,.12);text-align:left;border:3px solid transparent}
.diff b{font-size:20px} .diff small{display:block;font-size:14px;color:var(--ink2)}
.diff .dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.diff.sel{border-color:var(--mintD);background:#F2FBF7}
.toggles{display:grid;gap:8px;margin:6px 0 10px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;padding:6px 14px;background:#fff;border-radius:18px;box-shadow:0 3px 0 rgba(91,74,63,.1);width:100%;text-align:left}
.tog small{display:block;font-size:13px;color:var(--ink2)}
.sw{width:56px;height:32px;border-radius:999px;background:#E9DFD0;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:left .2s}
.tog.on .sw{background:var(--mintD)} .tog.on .sw::after{left:27px}
.two-help{background:var(--sky);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.6;margin:4px 0 10px}
.two-help ol{margin:4px 0 0;padding-left:1.4em}
.title-btns{display:grid;gap:10px;margin-bottom:8px}

/* ===== header ===== */
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex:none}
.hdr .ttl{flex:1;text-align:center;font-weight:700;font-size:17px;line-height:1.3}
.badge{display:inline-block;background:var(--butter);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700}

/* ===== stage select ===== */
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 3px 0 rgba(91,74,63,.1);margin-bottom:10px;flex:none}
.seg button{flex:1;min-height:46px;border-radius:999px;background:transparent;font-weight:700;font-size:16px}
.seg button.sel{background:var(--mint)}
.theme-card{margin-bottom:12px}
.tc-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tc-ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.tc-head b{font-size:18px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{min-height:72px;border-radius:18px;background:var(--cream);box-shadow:0 3px 0 rgba(91,74,63,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;gap:2px}
.lv .st{font-size:15px;color:var(--butterD);letter-spacing:1px}
.lv.locked{opacity:.55}
.lv small{font-size:12px;color:var(--ink2);font-weight:400}

/* ===== game ===== */
.gtop{display:flex;align-items:center;gap:8px;flex:none}
.hearts{display:flex;gap:2px;flex:1;justify-content:center}
.hearts svg{width:28px;height:28px}
.hearts .lost{animation:shrink .5s ease}
.prog{display:flex;justify-content:center;gap:8px;margin:6px 0;flex:none}
.prog i{width:14px;height:14px;border-radius:50%;background:#EADFCF;display:block}
.prog i.ok{background:var(--mintD)} .prog i.ng{background:var(--coral)} .prog i.wait{background:var(--butterD)} .prog i.cur{background:#fff;box-shadow:0 0 0 3px var(--skyD)}
.req{display:flex;gap:10px;align-items:flex-start;flex:none}
.req-ava{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--shadow);flex:none;overflow:hidden;font-size:34px}
.bubble{position:relative;background:#fff;border-radius:18px;padding:7px 12px;box-shadow:var(--shadow);font-size:16px;line-height:1.45;flex:1}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.bubble b{font-size:13px;color:var(--ink2);display:block;font-weight:700}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;position:relative;margin:6px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stage-in{margin:auto 0;display:flex;flex-direction:column;align-items:center;padding:4px 0}
.mini-ai{position:absolute;right:0;bottom:0;width:58px;height:64px;pointer-events:none}
.bottom{flex:none}
.manual-btn{width:100%;margin-bottom:10px;background:var(--butter)}
.two-note{background:var(--sky);border-radius:18px;padding:8px 12px;text-align:center;margin-bottom:10px;font-size:16px;line-height:1.5}
.answers{display:grid;gap:10px}
.answers.a3{grid-template-columns:repeat(3,1fr)}
.answers.a2{grid-template-columns:1fr 1fr}
.answers.a4{grid-template-columns:1fr 1fr}
.ans{min-height:72px;border-radius:20px;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(91,74,63,.16);transition:transform .08s;line-height:1.2}
.ans:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(91,74,63,.16)}
.ans small{font-size:14px;font-weight:700}
.ans.boxA{background:var(--mint)} .ans.boxB{background:var(--sky)} .ans.boxC{background:var(--peach)}
.ans.yes{background:var(--mint)} .ans.no{background:var(--peach)}
.ans.cand{background:#fff;min-height:92px;font-size:15px;padding:4px}
.ans.cand .pic{width:74px;height:56px}
.ans[disabled]{opacity:.6}
.timer{height:10px;border-radius:999px;background:#EEE3D3;overflow:hidden;margin:4px 0 0;flex:none}
.timer i{display:block;height:100%;background:var(--skyD);border-radius:999px;transition:width .25s linear}
.timer.low i{background:var(--coral)}

/* parcel */
.belt{position:relative;width:min(230px,62vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.belt::after{content:"";position:absolute;left:-10%;right:-10%;bottom:4%;height:16px;border-radius:999px;background:repeating-linear-gradient(90deg,#E6D7C0 0 18px,#EFE3D0 18px 36px);z-index:0}
.parcel{position:relative;z-index:1;transition:transform .3s;animation:slideIn .5s cubic-bezier(.3,1.4,.5,1)}
.parcel .pic{width:100%;height:100%}
.parcel .ov{position:absolute;inset:0}
.size-tag{position:absolute;top:0;left:0;z-index:2;background:#fff;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:700;box-shadow:var(--shadow)}

/* visitor card */
.board{background:var(--butter);border-radius:14px;padding:6px 14px;font-weight:700;margin-bottom:8px;box-shadow:var(--shadow)}
.vcard{position:relative;width:min(320px,86vw);background:#FFFDF7;border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;border:3px solid var(--sky);animation:slideIn .5s cubic-bezier(.3,1.4,.5,1)}
.vcard h4{margin:0 0 8px;font-size:15px;text-align:center;color:var(--skyD)}
.vrow{display:flex;gap:12px;align-items:center}
.vface{width:84px;height:84px;border-radius:50%;background:var(--sky);flex:none;overflow:hidden;font-size:52px}
.vtable{flex:1;font-size:16px;line-height:1.35}
.vtable div{display:flex;justify-content:space-between;gap:6px;border-bottom:2px dotted #EADFCF;padding:4px 0;align-items:center}
.vtable span{color:var(--ink2);font-size:14px}
.ticket{display:inline-block;padding:2px 12px;border-radius:6px;font-weight:700;color:#fff;position:relative;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.hanko{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.hanko.yes{border:3px solid #E98C7E;color:#E98C7E;transform:rotate(-12deg);font-weight:800}
.hanko.no{border:2px dashed #CDBFAE;color:#CDBFAE;font-size:12px}
.bigstamp{position:absolute;right:8px;top:30%;padding:8px 16px;border-radius:16px;font-size:28px;font-weight:800;border:5px solid;background:rgba(255,255,255,.85);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards;z-index:3}
.bigstamp.yes{color:var(--mintD);border-color:var(--mintD)}
.bigstamp.no{color:var(--peachD);border-color:var(--peachD)}

/* order */
.order{width:min(330px,88vw);background:#FFFDF7;border-radius:20px;box-shadow:var(--shadow);padding:10px 14px;border:3px solid var(--peach);animation:slideIn .5s cubic-bezier(.3,1.4,.5,1)}
.order h4{margin:0 0 6px;text-align:center;font-size:15px;color:var(--peachD)}
.order .vface{width:56px;height:56px;font-size:36px;background:var(--peach)}
.order .vtable{font-size:15px}.order .vtable div{padding:2px 0}
.order .vrow{align-items:flex-start}
.people{display:inline-flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.people i{width:12px;height:12px;border-radius:50%;background:var(--peachD);display:block}

/* sheet / manual */
.backdrop{position:absolute;inset:0;background:rgba(91,74,63,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--cream);border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.1,.5,1);z-index:21;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px)}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:56px;height:6px;border-radius:999px;background:#E3D6C3;margin:2px auto 8px;flex:none}
.sheet .sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 4px 6px}
.paper{position:relative;background:var(--paper);border-radius:18px;padding:22px 14px 16px 16px;box-shadow:var(--shadow);background-image:repeating-linear-gradient(transparent 0 33px,#E8EEF6 33px 35px);background-position:0 14px}
.paper .clip{position:absolute;top:-16px;left:26px;width:28px;height:56px}
.paper h3{margin:0 0 2px;font-size:20px;text-align:center}
.paper .sub{text-align:center;font-size:14px;color:var(--ink2);margin-bottom:8px}
.paper .how{background:var(--butter);border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.5;margin-bottom:10px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rule{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.85);border-radius:16px;padding:10px;border:2px solid transparent;position:relative;line-height:1.55}
.rnum{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.rule:nth-child(5n+1) .rnum{background:var(--mint)} .rule:nth-child(5n+2) .rnum{background:var(--peach)} .rule:nth-child(5n+3) .rnum{background:var(--sky)} .rule:nth-child(5n+4) .rnum{background:var(--butter)} .rule:nth-child(5n+5) .rnum{background:var(--lav)}
.rbody{flex:1;font-size:17px}
.rexc{margin-top:4px;background:var(--lav);border-radius:10px;padding:4px 8px;font-size:16px}
.rule.fb{border:2px dashed #E3D6C3;background:rgba(255,248,236,.9)}
.rule.new{border-color:var(--butterD)}
.newtag{position:absolute;top:-10px;right:10px;background:var(--butterD);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px}
.rule.hl{border-color:var(--coral);background:var(--coralBg);animation:wiggle .6s ease 2}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-weight:800;white-space:nowrap;vertical-align:middle}
.chip .pic{width:24px;height:20px}
.chip.A{background:var(--mint)} .chip.B{background:var(--sky)} .chip.C{background:var(--peach)}
.chip.yes{background:var(--mint)} .chip.no{background:var(--peach)} .chip.p{background:var(--butter)}
.sheet .close{margin-top:8px;flex:none}

/* overlays */
.ovl{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(91,74,63,.22);padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.ovl.on{display:flex}
.ovl.center{align-items:center}
.ovl .card{width:100%;max-height:100%;overflow-y:auto;animation:popUp .35s cubic-bezier(.3,1.5,.5,1)}
.fb-card{background:var(--coralBg)!important;border:3px solid var(--coral)}
.fb-head{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800}
.fb-head .pic{width:60px;height:66px}
.fb-card p{margin:8px 0;line-height:1.6}
.num{background:var(--coral);color:#fff;border-radius:999px;padding:0 8px}
.praise{position:absolute;inset:0;z-index:31;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.praise.on{display:flex}
.praise .pic{width:120px;height:130px;animation:jump .6s ease}
.praise .txt{background:#fff;border-radius:999px;padding:10px 26px;font-size:30px;font-weight:800;color:var(--mintD);box-shadow:var(--shadow);animation:popUp .4s cubic-bezier(.3,1.6,.5,1)}
.intro-ai{display:flex;align-items:center;gap:10px}
.intro-ai .pic{width:74px;height:80px;flex:none}
.newrule{background:var(--butter);border-radius:18px;padding:10px;margin:10px 0}
.newrule b{display:block;margin-bottom:6px;font-size:18px}
.newrule ol{list-style:none;padding:0;margin:0}
.rev-row{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;margin:6px 0;line-height:1.45;font-size:15px}
.rev-row .mk{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:20px}
.mk.ok{background:var(--mint);color:#2F7D60}.mk.ng{background:var(--coral);color:#fff}
.toast{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:10px 20px;font-weight:700;box-shadow:var(--shadow);z-index:32;display:none;white-space:nowrap}
.toast.on{display:block;animation:popUp .3s ease}

/* result */
.res-stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.res-stars svg{width:62px;height:62px}
.res-stars .on{animation:popUp .5s cubic-bezier(.3,1.6,.5,1) both}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.6s linear forwards}
.center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.center-col .pic{width:150px;height:160px}

/* manual-only */
.mv-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;flex:none}
.mv-tabs button{min-height:50px;border-radius:16px;background:#fff;font-weight:800;box-shadow:0 3px 0 rgba(91,74,63,.12);font-size:16px}
.mv-tabs button.sel{background:var(--butter)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes popUp{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{0%{transform:translateX(60%) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}70%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes wiggle{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
@keyframes shrink{0%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-height:700px){.vface{width:68px;height:68px;font-size:42px}.vtable div{padding:2px 0}.ans.cand{min-height:78px}.ans.cand .pic{width:62px;height:46px}.manual-btn{min-height:50px;margin-bottom:8px}.bubble{font-size:15px}}
@media (max-height:640px){.req-ava{width:46px;height:46px;font-size:28px}.ans{min-height:62px}.belt{width:min(190px,52vw)}.hero .pic{width:100px;height:108px}.logo .l2{font-size:38px}}
</style>
</head>
<body>
<div id="app">
  <section class="scr" id="scr-title"></section>
  <section class="scr" id="scr-select"></section>
  <section class="scr" id="scr-game"></section>
  <section class="scr" id="scr-result"></section>
  <section class="scr" id="scr-retry"></section>
  <section class="scr" id="scr-manual"></section>
  <div class="backdrop" id="backdrop" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="指示書">
    <div class="grab"></div>
    <div class="sbody" id="sheetBody"></div>
    <button class="btn close" data-act="closeSheet">とじる</button>
  </div>
  <div class="ovl" id="ovl"></div>
  <div class="praise" id="praise"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- =====================================================================
  ゲームのルール計算（画面とは関係のない部分）。
  指示書の文章と正解は、ここにある同じルールデータから作られます。
  test.js は、この下の logic という名前のスクリプトだけを取り出してテストします。
====================================================================== -->
<script id="logic">
var AIGame = (function () {
  'use strict';

  // ---------- 乱数（同じ種なら同じ結果 → 2台のスマホで同じ指示書） ----------
  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return function () { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
  }
  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function seededRng(str) { return mulberry32(xmur3(str)()); }
  function pick(rng, a) { return a[Math.floor(rng() * a.length)]; }
  function shuffle(rng, a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // {かな|漢字} → むずかしさに合わせてどちらかを使う
  function T(s, kanji) { return String(s).replace(/\{([^|{}]*)\|([^|{}]*)\}/g, function (m, k, j) { return kanji ? j : k; }); }

  // ---------- 文の形（「〜の とき」「〜で、」「ただし〜なら」） ----------
  function N(subj, val) { return { a: subj + 'が「' + val + '」の', t: subj + 'が「' + val + '」で', c: subj + 'が「' + val + '」なら' }; }
  function NN(subj, val) { return { a: subj + 'が「' + val + '」では ない', t: subj + 'が「' + val + '」では なく', c: subj + 'が「' + val + '」で なければ' }; }
  function NI(subj, vals) { var v = vals.map(function (x) { return '「' + x + '」'; }).join('か'); return { a: subj + 'が' + v + 'の', t: subj + 'が' + v + 'で', c: subj + 'が' + v + 'なら' }; }
  function P(ph) { return { a: ph + 'の', t: ph + 'で', c: ph + 'なら' }; }
  function V(a, t, c) { return { a: a, t: t, c: c }; }
  function aru(s) { return V(s + 'が ある', s + 'が あって', s + 'が あれば'); }
  function nai(s) { return V(s + 'が ない', s + 'が なくて', s + 'が なければ'); }

  var DIFFS = {
    easy:   { id: 'easy',   label: 'かんたん',   hint: '小学校低学年から', counts: [2, 3, 3], kanji: false, maxTier: 1 },
    normal: { id: 'normal', label: 'ふつう',     hint: '小学校高学年から', counts: [4, 5, 5], kanji: true,  maxTier: 2 },
    hard:   { id: 'hard',   label: 'むずかしい', hint: '中学生〜おとな',   counts: [6, 7, 8], kanji: true,  maxTier: 3 }
  };

  var COLORS = ['あか', 'あお', 'きいろ', 'みどり'];
  var SHAPES = ['まる', 'さんかく', 'しかく'];
  var ANIMALS = ['くま', 'うさぎ', 'ねこ', 'きつね', 'いぬ', 'ぶた'];
  var DAYS = ['{げつようび|月曜日}', '{かようび|火曜日}', '{すいようび|水曜日}', '{もくようび|木曜日}', '{きんようび|金曜日}'];
  var FLAVORS = ['いちご', 'チョコ', 'バナナ'];
  var PRODUCTS = [
    { id: 'ichigo', name: 'いちごケーキ' }, { id: 'choco', name: 'チョコケーキ' }, { id: 'pudding', name: 'プリン' },
    { id: 'donut', name: 'ドーナツ' }, { id: 'cookie', name: 'クッキー' }, { id: 'macaron', name: 'マカロン' },
    { id: 'roll', name: 'ロールケーキ' }, { id: 'candy', name: 'キャンディ' }
  ];
  // 名前（小さい「ッャュョ」や「ー」は使わない → 文字数が数えやすい）
  var NAMES = {
    2: ['ポポ', 'ミミ', 'ココ', 'ララ', 'モモ', 'ルル', 'ナナ', 'ピノ'],
    3: ['ポンタ', 'ミルク', 'ココア', 'マロン', 'ハルカ', 'ソラタ', 'コハル', 'ピコタ'],
    4: ['マカロン', 'クルミン', 'ピコリン', 'ハナマル', 'ムギマル', 'モコタロ'],
    5: ['マシマロン', 'コロコロン', 'ポンポコタ', 'ピコピコン', 'モモタロウ', 'ミルクパン']
  };

  function E(k, op, v, tier, tags) { var o = { k: k, op: op, v: v, tier: tier }; if (tags) for (var t in tags) o[t] = tags[t]; return o; }

  var THEMES = {};

  // ===== 指示書A：おとどけもの仕分け =====
  THEMES.A = {
    id: 'A', icon: '📦', title: '{おとどけもの しわけ|おとどけもの仕分け}',
    noun: '{この にもつ|この荷物}', outcomes: ['A', 'B', 'C'],
    outText: function (o) { return o; },
    space: function () {
      var r = [];
      for (var c = 0; c < 4; c++) for (var s = 0; s < 3; s++) for (var z = 0; z < 2; z++)
        for (var h = 0; h < 4; h++) for (var st = 0; st < 4; st++) for (var sn = 0; sn < 2; sn++)
          r.push({ color: c, shape: s, size: z, hearts: h, stars: st, snow: sn });
      return r;
    },
    atoms: function () {
      var L = [], v;
      for (v = 0; v < 4; v++) { L.push(E('color', 'eq', v, 1)); L.push(E('color', 'ne', v, 2, { neg: 1 })); }
      for (v = 0; v < 3; v++) { L.push(E('shape', 'eq', v, 1)); L.push(E('shape', 'ne', v, 2, { neg: 1 })); }
      L.push(E('size', 'eq', 1, 1), E('size', 'eq', 0, 1), E('snow', 'eq', 1, 1), E('snow', 'eq', 0, 1));
      ['hearts', 'stars'].forEach(function (k) {
        L.push(E(k, 'ge', 1, 1), E(k, 'ge', 2, 2), E(k, 'ge', 3, 2), E(k, 'le', 0, 2), E(k, 'le', 1, 2));
      });
      [3, 4, 5].forEach(function (n) { L.push(E(['hearts', 'stars'], 'sumge', n, 3, { count: 1 })); });
      L.push(E(['hearts', 'stars'], 'eqk', 0, 3, { count: 1 }));
      [[0, 1], [0, 2], [1, 3], [2, 3]].forEach(function (p) { L.push(E('color', 'in', p, 3, { or: 1 })); });
      [[0, 1], [1, 2], [0, 2]].forEach(function (p) { L.push(E('shape', 'in', p, 3, { or: 1 })); });
      return L;
    },
    say: function (a) {
      var k = a.k, op = a.op, v = a.v, S;
      if (k === 'color' || k === 'shape') {
        S = k === 'color' ? '{いろ|色}' : '{かたち|形}'; var names = k === 'color' ? COLORS : SHAPES;
        return op === 'eq' ? N(S, names[v]) : op === 'ne' ? NN(S, names[v]) : NI(S, v.map(function (i) { return names[i]; }));
      }
      if (k === 'size') return v ? V('{にもつが おおきい|荷物が 大きい}', '{にもつが おおきくて|荷物が 大きくて}', '{にもつが おおきければ|荷物が 大きければ}')
                                 : V('{にもつが ちいさい|荷物が 小さい}', '{にもつが ちいさくて|荷物が 小さくて}', '{にもつが ちいさければ|荷物が 小さければ}');
      if (k === 'snow') return v ? aru('❄マーク') : nai('❄マーク');
      if (k === 'hearts' || k === 'stars') {
        S = k === 'hearts' ? 'ハートの シール' : '{ほし|星}の シール';
        if (op === 'ge' && v === 1) return aru(S);
        if (op === 'ge') return P(S + 'が ' + v + 'まい {いじょう|以上}');
        if (op === 'le' && v === 0) return nai(S);
        return P(S + 'が ' + v + 'まい {いか|以下}');
      }
      if (op === 'sumge') return P('ハートと {ほし|星}の シールが {あわせて|合わせて} ' + v + 'まい {いじょう|以上}');
      if (op === 'eqk') return P('ハートと {ほし|星}の シールが {おなじ かず|同じ数}');
      throw new Error('say A ' + JSON.stringify(a));
    },
    decorate: function (it) { return it; }
  };

  // ===== 指示書B：どうぶつ病院の受付 =====
  THEMES.B = {
    id: 'B', icon: '🏥', title: '{どうぶつびょういんの うけつけ|どうぶつ病院の受付}',
    noun: 'この {どうぶつさん|動物さん}', outcomes: ['yes', 'no'],
    outText: function (o) { return o === 'yes' ? 'はい（とおす）' : 'いいえ（まってもらう）'; },
    space: function () {
      var r = [];
      for (var a = 0; a < 6; a++) for (var d = 0; d < 5; d++) for (var td = 0; td < 5; td++)
        for (var t = 0; t < 4; t++) for (var s = 0; s < 2; s++) for (var n = 2; n <= 5; n++)
          r.push({ animal: a, day: d, today: td, ticket: t, stamp: s, nameLen: n });
      return r;
    },
    atoms: function () {
      var L = [], v;
      for (v = 0; v < 6; v++) { L.push(E('animal', 'eq', v, 1)); L.push(E('animal', 'ne', v, 2, { neg: 1 })); }
      for (v = 0; v < 4; v++) { L.push(E('ticket', 'eq', v, 1)); L.push(E('ticket', 'ne', v, 2, { neg: 1 })); }
      L.push(E('stamp', 'eq', 1, 1), E('stamp', 'eq', 0, 1), E(['day', 'today'], 'eqk', 0, 1), E(['day', 'today'], 'nek', 0, 2, { neg: 1 }));
      for (v = 0; v < 5; v++) L.push(E('day', 'eq', v, 2));
      [3, 4, 5].forEach(function (n) { L.push(E('nameLen', 'ge', n, 3, { count: 1 })); });
      [2, 3].forEach(function (n) { L.push(E('nameLen', 'le', n, 3, { count: 1 })); });
      L.push(E(['day', 'today'], 'ltk', 0, 3, { count: 1 }));
      [[0, 1], [2, 3], [4, 5], [1, 2]].forEach(function (p) { L.push(E('animal', 'in', p, 3, { or: 1 })); });
      [[0, 1], [2, 3]].forEach(function (p) { L.push(E('ticket', 'in', p, 3, { or: 1 })); });
      return L;
    },
    say: function (a) {
      var k = a.k, op = a.op, v = a.v, S;
      if (k === 'animal' || k === 'ticket') {
        S = k === 'animal' ? '{いきもの|動物}' : '{けんの いろ|券の色}'; var names = k === 'animal' ? ANIMALS : COLORS;
        return op === 'eq' ? N(S, names[v]) : op === 'ne' ? NN(S, names[v]) : NI(S, v.map(function (i) { return names[i]; }));
      }
      if (k === 'stamp') return v ? aru('はんこ') : nai('はんこ');
      if (k === 'day') return N('{よやくの ひ|予約の日}', DAYS[v]);
      if (op === 'eqk') return P('{よやくの ひが きょう|予約の日が 今日}');
      if (op === 'nek') return V('{よやくの ひが きょうでは ない|予約の日が 今日では ない}', '{よやくの ひが きょうでは なく|予約の日が 今日では なく}', '{よやくの ひが きょうで なければ|予約の日が 今日で なければ}');
      if (op === 'ltk') return P('{よやくの ひが きょうより まえ|予約の日が 今日より 前}');
      if (k === 'nameLen') return op === 'ge' ? P('{なまえが|名前が} ' + v + '{もじ いじょう|文字以上}') : P('{なまえが|名前が} ' + v + '{もじ いか|文字以下}');
      throw new Error('say B ' + JSON.stringify(a));
    },
    decorate: function (it, rng) { it.name = pick(rng, NAMES[it.nameLen]); return it; }
  };

  // ===== 指示書C：おかしやさんの注文 =====
  THEMES.C = {
    id: 'C', icon: '🍰', title: '{おかしやさんの ちゅうもん|おかしやさんの注文}',
    noun: '{この ちゅうもん|この注文}', outcomes: PRODUCTS.map(function (p) { return p.id; }),
    outText: function (o) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === o) return PRODUCTS[i].name; return o; },
    space: function () {
      var r = [];
      for (var f = 0; f < 3; f++) for (var p = 1; p <= 6; p++) for (var b = 0; b < 2; b++) for (var t = 0; t < 2; t++) for (var k = 0; k < 2; k++)
        r.push({ flavor: f, people: p, bday: b, takeout: t, kid: k });
      return r;
    },
    atoms: function () {
      var L = [], v;
      for (v = 0; v < 3; v++) { L.push(E('flavor', 'eq', v, 1)); L.push(E('flavor', 'ne', v, 2, { neg: 1 })); }
      L.push(E('people', 'eq', 1, 1), E('bday', 'eq', 1, 1), E('bday', 'eq', 0, 1), E('takeout', 'eq', 1, 1), E('takeout', 'eq', 0, 1), E('kid', 'eq', 1, 1), E('kid', 'eq', 0, 1));
      [3, 4, 5].forEach(function (n) { L.push(E('people', 'ge', n, 2)); });
      [2, 3].forEach(function (n) { L.push(E('people', 'le', n, 2)); });
      L.push(E('people', 'even', 0, 3, { count: 1 }));
      [3, 4, 5].forEach(function (n) { L.push(E('people', 'eq', n, 3, { count: 1 })); });
      [[0, 1], [1, 2], [0, 2]].forEach(function (p) { L.push(E('flavor', 'in', p, 3, { or: 1 })); });
      return L;
    },
    say: function (a) {
      var k = a.k, op = a.op, v = a.v, S;
      if (k === 'flavor') { S = '{すきな あじ|好きな味}'; return op === 'eq' ? N(S, FLAVORS[v]) : op === 'ne' ? NN(S, FLAVORS[v]) : NI(S, v.map(function (i) { return FLAVORS[i]; })); }
      if (k === 'people') {
        if (op === 'eq') return N('{にんずう|人数}', v + '{にん|人}');
        if (op === 'ge') return P('{にんずうが|人数が} ' + v + '{にん いじょう|人以上}');
        if (op === 'le') return P('{にんずうが|人数が} ' + v + '{にん いか|人以下}');
        if (op === 'even') return P('{にんずうが ぐうすう（2・4・6にん）|人数が 偶数（2・4・6人）}');
      }
      if (k === 'bday') return v ? aru('🎂マーク') : nai('🎂マーク');
      if (k === 'takeout') return N('{たべる ばしょ|食べる場所}', v ? '{おうち|お家}' : '{おみせ|お店}');
      if (k === 'kid') return N('{おきゃくさん|お客さん}', v ? '{こども|子ども}' : '{おとな|大人}');
      throw new Error('say C ' + JSON.stringify(a));
    },
    decorate: function (it, rng) { it.customer = Math.floor(rng() * CUSTOMERS); return it; }
  };
  var CUSTOMERS = 6; // お客さんの絵の数（画面側の表と合わせる）

  // ---------- ルールの判定 ----------
  function evalAtom(sp, it) {
    switch (sp.op) {
      case 'eq': return it[sp.k] === sp.v;
      case 'ne': return it[sp.k] !== sp.v;
      case 'in': return sp.v.indexOf(it[sp.k]) >= 0;
      case 'ge': return it[sp.k] >= sp.v;
      case 'le': return it[sp.k] <= sp.v;
      case 'even': return it[sp.k] % 2 === 0;
      case 'sumge': return it[sp.k[0]] + it[sp.k[1]] >= sp.v;
      case 'eqk': return it[sp.k[0]] === it[sp.k[1]];
      case 'nek': return it[sp.k[0]] !== it[sp.k[1]];
      case 'ltk': return it[sp.k[0]] < it[sp.k[1]];
    }
    throw new Error('op ' + sp.op);
  }
  function matchRule(r, it) { if (r.fallback) return true; for (var i = 0; i < r.conds.length; i++) if (!evalAtom(r.conds[i], it)) return false; return true; }
  // 上から順番に見て、さいしょに当てはまったルールが答え
  function evaluate(rules, it) {
    for (var i = 0; i < rules.length; i++) {
      var r = rules[i];
      if (matchRule(r, it)) {
        if (r.exc && evalAtom(r.exc.cond, it)) return { index: i, branch: 1, answer: r.exc.out };
        return { index: i, branch: 0, answer: r.out };
      }
    }
    return null;
  }

  // ---------- 指示書の文章 ----------
  function ruleParts(themeId, rule, kanji) {
    var th = THEMES[themeId];
    var cond, exc = null;
    if (rule.fallback) cond = '{どれにも あてはまらない|どれにも 当てはまらない} とき';
    else {
      var f = rule.conds.map(function (c) { return th.say(c); });
      cond = f.length === 1 ? f[0].a + ' とき' : f.slice(0, -1).map(function (x) { return x.t; }).join('、') + '、' + f[f.length - 1].a + ' とき';
      if (rule.exc) exc = 'ただし、' + th.say(rule.exc.cond).c;
    }
    return { cond: T(cond, kanji), out: rule.out, exc: exc ? T(exc, kanji) : null, excOut: rule.exc ? rule.exc.out : null };
  }
  function ruleSig(r) {
    if (r.fallback) return 'fb';
    var s = r.conds.map(function (c) { return JSON.stringify([c.k, c.op, c.v]); }).sort().join('&');
    return s + (r.exc ? '|' + JSON.stringify([r.exc.cond.k, r.exc.cond.op, r.exc.cond.v]) : '');
  }

  // ---------- 指示書づくり ----------
  function keysOf(a) { return Array.isArray(a.k) ? a.k : [a.k]; }
  function disjoint(a, b) { var ka = keysOf(a), kb = keysOf(b); for (var i = 0; i < ka.length; i++) if (kb.indexOf(ka[i]) >= 0) return false; return true; }
  function clean(a) { return { k: a.k, op: a.op, v: a.v }; }
  var spaceCache = {};
  function spaceOf(themeId) { return spaceCache[themeId] || (spaceCache[themeId] = THEMES[themeId].space()); }

  function makeRule(th, diff, kind, rng, born) {
    var pool = th.atoms().filter(function (a) { return a.tier <= DIFFS[diff].maxTier; });
    var plain = pool.filter(function (a) { return !a.neg && !a.or && !a.count; });
    var conds, exc = null, c;
    if (kind === 'single') conds = [pick(rng, plain)];
    else if (kind === 'neg') conds = [pick(rng, pool.filter(function (a) { return a.neg; }))];
    else if (kind === 'count') conds = [pick(rng, pool.filter(function (a) { return a.count; }))];
    else if (kind === 'or') conds = [pick(rng, pool.filter(function (a) { return a.or; }))];
    else if (kind === 'and') {
      var base = pool.filter(function (x) { return !x.or && !x.count; });
      var a = pick(rng, base);
      c = base.filter(function (x) { return disjoint(x, a) && !(x.neg && a.neg); });
      if (!c.length) return null;
      var b = pick(rng, c);
      conds = a.neg ? [a, b] : [b, a];
    } else if (kind === 'exc') {
      var m = pick(rng, plain);
      c = pool.filter(function (x) { return !x.or && !x.neg && disjoint(x, m); });
      if (!c.length) return null;
      conds = [m]; exc = { cond: clean(pick(rng, c)), out: null };
    }
    return { kind: kind, conds: conds.map(clean), out: null, exc: exc, born: born };
  }
  function chooseOut(th, rng, avoid, used) {
    var opts = th.outcomes.filter(function (o) { return avoid.indexOf(o) < 0; });
    if (th.outcomes.length > 3) { var fresh = opts.filter(function (o) { return used.indexOf(o) < 0; }); if (fresh.length) opts = fresh; }
    if (rng() < 0.2 && avoid.length <= 1) opts = th.outcomes.filter(function (o) { return o !== avoid[1]; });
    return pick(rng, opts.length ? opts : th.outcomes);
  }
  function fillOut(th, rng, r, fbOut, used) {
    r.out = chooseOut(th, rng, [fbOut], used); used.push(r.out);
    if (r.exc) { r.exc.out = chooseOut(th, rng, [r.out, r.out], used); if (r.exc.out === r.out) return false; used.push(r.exc.out); }
    return true;
  }
  var KINDS = { easy: ['single'], normal: ['single', 'neg', 'and'], hard: ['single', 'neg', 'and', 'count', 'exc', 'or'] };
  var REQUIRED = { easy: [], normal: ['neg', 'and'], hard: ['exc', 'count', 'and', 'neg'] };

  function makeBase(th, diff, rng, n) {
    var fbOut = pick(rng, th.outcomes), used = [fbOut];
    var kinds = REQUIRED[diff].slice();
    while (kinds.length < n - 1) kinds.push(pick(rng, KINDS[diff]));
    var rules = [];
    for (var i = 0; i < kinds.length; i++) {
      var r = makeRule(th, diff, kinds[i], rng, 1);
      if (!r || !fillOut(th, rng, r, fbOut, used)) return null;
      rules.push(r);
    }
    rules = shuffle(rng, rules);
    rules.push({ kind: 'fallback', fallback: true, out: fbOut, conds: [], exc: null, born: 1 });
    return rules;
  }

  // すべての荷物（来た人・注文）を調べて、どのルールにも意味があるかを確かめる
  function analyze(themeId, rules) {
    var space = spaceOf(themeId);
    var buckets = rules.map(function () { return [[], []]; });
    for (var i = 0; i < space.length; i++) { var e = evaluate(rules, space[i]); buckets[e.index][e.branch].push(space[i]); }
    return buckets;
  }
  function validate(themeId, rules, diff) {
    var sigs = {}, i;
    for (i = 0; i < rules.length; i++) { var s = ruleSig(rules[i]); if (sigs[s]) return false; sigs[s] = 1; }
    var req = REQUIRED[diff];
    for (i = 0; i < req.length; i++) if (!rules.some(function (r) { return r.kind === req[i]; })) return false;
    var outs = {}; rules.forEach(function (r) { outs[r.out] = 1; if (r.exc) outs[r.exc.out] = 1; });
    var th = THEMES[themeId], needOuts = Math.min(th.outcomes.length, rules.length >= 4 ? 3 : 2);
    if (Object.keys(outs).length < needOuts) return false;
    var buckets = analyze(themeId, rules);
    for (i = 0; i < rules.length; i++) {
      var r = rules[i];

        if (g.hearts > 0) g.hearts--;
        $('hearts').innerHTML = heartsHtml();
        var hs = $('hearts').children; if (hs[g.hearts]) hs[g.hearts].classList.add('lost');
        feedback(q);
      }
      $('prog').innerHTML = progHtml();
    }, delay);
  }
  function praise() {
    var p = $('praise');
    p.innerHTML = aiPic('happy') + '<div class="txt">' + PRAISE[Math.floor(Math.random() * PRAISE.length)] + '</div>';
    p.classList.add('on'); later(function () { p.classList.remove('on'); }, 1100);
  }
  function whyText(q, m) {
    var r = m.rules[q.ruleIndex], n = q.ruleIndex + 1;
    if (r.fallback) return 'どれにも 当てはまらないので、さいごの <b class="num">' + n + 'ばん</b> に なるよ。';
    if (q.branch) return '指示書の <b class="num">' + n + 'ばん</b> の「ただし」に 当てはまるよ。';
    return '指示書の <b class="num">' + n + 'ばん</b> に 当てはまるよ。';
  }
  function feedback(q) {
    var g = S.game, m = g.manual, kj = K();
    var h = '<div class="card fb-card"><div class="fb-head">' + aiPic('oops') + '<span>おしい！</span></div>';
    h += '<p>' + tx(G.THEMES[g.theme].noun) + 'は ' + whyText(q, m).replace(/指示書/g, SJ) + '</p>';
    h += '<ol class="rules" start="' + (q.ruleIndex + 1) + '">' + ruleLi(m, q.ruleIndex, { highlight: q.ruleIndex }) + '</ol>';
    h += '<p>こたえは ' + chip(g.theme, q.answer, kj) + ' だよ。</p>';
    if (g.theme === 'C' || g.theme === 'A') h += '<p class="muted">上の ルールから じゅんばんに たしかめて みよう。</p>';
    h += '<div class="row">' + (g.two ? '' : '<button class="btn butter small" data-act="checkManual" data-i="' + q.ruleIndex + '">📖 たしかめる</button>') + '<button class="btn mint small" data-act="afterFb">つぎへ ▶</button></div></div>';
    showOvl(h);
  }
  function reveal() {
    var g = S.game, m = g.manual, kj = K();
    var start = g.idx <= 2 ? 0 : 3, end = g.idx, okN = 0, h = '';
    for (var i = start; i <= end; i++) {
      var r = g.results[i], q = g.qs[i]; r.revealed = true;
      if (r.ok) okN++; else { g.mistakes++; if (g.hearts > 0) g.hearts--; }
      h += '<div class="rev-row"><span class="mk ' + (r.ok ? 'ok' : 'ng') + '">' + (r.ok ? '○' : '×') + '</span><div>' + (i + 1) + 'もんめ：' + (r.ok ? 'せいかい！' : (r.v === null ? 'じかんぎれ。' : '') + 'こたえは ' + chip(g.theme, q.answer, kj) + '<br><span class="muted">' + SJ + 'の ' + (q.ruleIndex + 1) + 'ばん' + (q.branch ? 'の「ただし」' : '') + 'に 当てはまるよ</span>') + '</div></div>';
    }
    var n = end - start + 1;
    if (okN === n) Snd.chime(); else Snd.oops();
    $('hearts').innerHTML = heartsHtml(); $('prog').innerHTML = progHtml();
    showOvl('<div class="card"><div class="fb-head">' + aiPic(okN === n ? 'happy' : 'think') + '<span>こたえあわせ</span></div><p style="font-size:20px;font-weight:800;text-align:center">' + n + 'もん中 ' + okN + 'もん せいかい！</p>' + h +
      '<button class="btn mint" style="width:100%;margin-top:8px" data-act="afterFb">つぎへ ▶</button></div>');
  }
  function next() {
    var g = S.game; if (!g) return;
    if (g.quitOpen) { g.pendingNext = true; return; }
    hideOvl();
    if (g.diff !== 'easy' && g.hearts <= 0) return gameOver();
    if (g.idx >= g.qs.length - 1) return finish();
    g.idx++;
    renderGame();
  }
  function finish() {
    var g = S.game; clearTimers();
    var stars = g.mistakes === 0 ? 3 : g.mistakes <= 2 ? 2 : 1, key = g.diff + '-' + g.theme + '-' + g.level;
    if ((save.stars[key] || 0) < stars) { save.stars[key] = stars; persist(); }
    Snd.fanfare();
    var msg = stars === 3 ? 'かんぺき！ 一人前の AIだね！' : stars === 2 ? 'すごい！ あと すこしで かんぺき！' : 'クリア おめでとう！ つぎは もっと できるよ！';
    var st = ''; for (var i = 0; i < 3; i++) st += '<span class="' + (i < stars ? 'on' : '') + '" style="animation-delay:' + (i * 0.2) + 's">' + starSvg(i < stars) + '</span>';
    var conf = '<div class="confetti">'; var cols = ['#CDEFE0', '#FFDCCB', '#D6EAFB', '#FFEDB0', '#E6DDF8', '#FF8FA8'];
    for (var c = 0; c < 26; c++) conf += '<i style="left:' + Math.floor(Math.random() * 100) + '%;background:' + cols[c % cols.length] + ';animation-delay:' + (Math.random() * 1.2).toFixed(2) + 's"></i>';
    conf += '</div>';
    var nextBtn = g.level < 3 ? '<button class="btn mint big" style="width:100%" data-act="start" data-t="' + g.theme + '" data-l="' + (g.level + 1) + '">つぎの レベルへ ▶</button>' :
      (g.theme !== 'C' ? '<button class="btn mint big" style="width:100%" data-act="start" data-t="' + (g.theme === 'A' ? 'B' : 'C') + '" data-l="1">つぎの ' + SJ + 'へ ▶</button>' : '');
    $('scr-result').innerHTML = conf + '<div class="center-col">' + aiPic('happy') + '<h2>ステージ クリア！</h2><div class="res-stars">' + st + '</div><p style="font-size:18px;font-weight:700;margin:4px 0">' + msg + '</p><p class="muted">まちがい：' + g.mistakes + 'かい</p></div>' +
      '<div style="display:grid;gap:10px">' + nextBtn + '<div class="row"><button class="btn butter" data-act="start" data-t="' + g.theme + '" data-l="' + g.level + '">もういちど</button><button class="btn sky" data-act="toSelect">ステージ えらび</button></div></div>';
    show('scr-result');
  }
  function gameOver() {
    var g = S.game; clearTimers();
    $('scr-retry').innerHTML = '<div class="center-col">' + aiPic('oops') + '<h2>ちょっと ひとやすみ</h2><p style="line-height:1.7">ハートが なくなっちゃった。<br>でも だいじょうぶ！<br>' + SJ + 'を 上から じっくり 読んで、<br>もういちど やってみよう。</p></div>' +
      '<div style="display:grid;gap:10px"><button class="btn mint big" data-act="start" data-t="' + g.theme + '" data-l="' + g.level + '">もういちど</button><button class="btn sky" data-act="toSelect">ステージ えらび</button></div>';
    show('scr-retry');
  }

  // ---------- 指示書だけ モード（#manual-A など） ----------
  function renderManualView() {
    var mv = S.mv, h = '<div class="hdr"><button class="icon-btn" data-act="mvBack" aria-label="もどる">←</button><div class="ttl">📖 ' + SJ + 'だけ モード</div><span style="width:48px"></span></div>';
    h += '<div class="mv-tabs">' + ['A', 'B', 'C'].map(function (t) { return '<button class="' + (mv.theme === t ? 'sel' : '') + '" data-act="mvTheme" data-v="' + t + '">' + G.THEMES[t].icon + ' ' + SJ + t + '</button>'; }).join('') + '</div>';
    h += '<div class="seg">' + ['easy', 'normal', 'hard'].map(function (d) { return '<button class="' + (mv.diff === d ? 'sel' : '') + '" data-act="mvDiff" data-v="' + d + '">' + G.DIFFS[d].label + '</button>'; }).join('') + '</div>';
    h += '<div class="seg">' + [1, 2, 3].map(function (l) { return '<button class="' + (mv.level === l ? 'sel' : '') + '" data-act="mvLevel" data-v="' + l + '">レベル' + l + '</button>'; }).join('') + '</div>';
    h += '<div class="scroll" style="flex:1;padding:14px 2px 6px"><p class="muted" style="margin:0 0 12px;text-align:center">おだいの 画面と 同じ ' + SJ + '・むずかしさ・レベルを えらんでね</p>' + manualHtml(G.getManual(mv.theme, mv.diff, mv.level)) + '</div>';
    $('scr-manual').innerHTML = h;
  }
  function setManualHash() { try { history.replaceState(null, '', '#manual-' + S.mv.theme); } catch (e) {} }
  function route() {
    var m = /^#manual-([ABC])(?:-([123]))?(?:-(easy|normal|hard))?$/.exec(location.hash || '');
    if (m) {
      clearTimers(); S.game = null;
      S.mv.theme = m[1]; if (m[2]) S.mv.level = +m[2]; if (m[3]) S.mv.diff = m[3];
      show('scr-manual'); renderManualView();
    } else if (!S.game) { renderTitle(); show('scr-title'); }
  }

  // ---------- ボタンの動き ----------
  var A = {
    diff: function (b) { save.diff = b.dataset.v; persist(); renderTitle(); },
    diffSel: function (b) { save.diff = b.dataset.v; persist(); renderSelect(); },
    two: function () { save.two = !save.two; persist(); renderTitle(); },
    timer: function () { save.timer = !save.timer; persist(); renderTitle(); },
    sound: function () { save.sound = !save.sound; persist(); Snd.unlock(); renderTitle(); if (save.sound) Snd.chime(); },
    toSelect: function () { clearTimers(); S.game = null; renderSelect(); show('scr-select'); },
    toTitle: function () { clearTimers(); S.game = null; renderTitle(); show('scr-title'); },
    howto: howto, hideOvl: hideOvl,
    toManual: function () { S.mv.diff = save.diff; location.hash = '#manual-A'; },
    mvBack: function () { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; } renderTitle(); show('scr-title'); },
    mvTheme: function (b) { S.mv.theme = b.dataset.v; setManualHash(); renderManualView(); },
    mvDiff: function (b) { S.mv.diff = b.dataset.v; renderManualView(); },
    mvLevel: function (b) { S.mv.level = +b.dataset.v; renderManualView(); },
    start: function (b) { startStage(b.dataset.t, +b.dataset.l); },
    locked: function () { toast('🔒 まえの レベルを クリアしてね'); },
    begin: function () { hideOvl(); },
    manual: function () { openSheet(); },
    closeSheet: closeSheet,
    answer: function (b) { answer(b.dataset.v); },
    checkManual: function (b) { openSheet(+b.dataset.i); },
    afterFb: function () { next(); },
    resume: function () {
      var g = S.game; hideOvl(); if (!g) return;
      g.quitOpen = false;
      if (g.pendingNext) { g.pendingNext = false; next(); }
      else if (g.savedOvl) { showOvl(g.savedOvl.html, g.savedOvl.center); }
      g.savedOvl = null;
    },
    quit: function () {
      var g = S.game, o = $('ovl');
      if (g) { g.quitOpen = true; g.savedOvl = o.classList.contains('on') ? { html: o.innerHTML, center: o.classList.contains('center') } : null; }
      showOvl('<div class="card" style="text-align:center"><div class="intro-ai" style="justify-content:center">' + aiPic('think') + '</div><h2>ステージを やめる？</h2><div class="row"><button class="btn butter" data-act="resume">つづける</button><button class="btn sky" data-act="toSelect">やめる</button></div></div>', true);
    }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var f = A[b.dataset.act]; if (!f) return;
    if (b.dataset.act !== 'answer') Snd.pop();
    f(b);
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
